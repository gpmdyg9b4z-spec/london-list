<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>London List</title>
<style>
  :root {
    --ink: #1a1410;
    --paper: #f5f0e8;
    --sepia: #8b6f47;
    --sepia-light: #c4a882;
    --done: #6b7b5e;
    --accent: #c0392b;
    --border: rgba(139,111,71,0.25);
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; color-scheme: light; }
  html, body { background: #f5f0e8 !important; color: #1a1410 !important; }
  body { font-family: var(--sans); min-height: 100vh; padding: 0 0 90px; -webkit-text-size-adjust: 100%; }

  /* STICKY TOP */
  .sticky-top { position: sticky; top: 0; z-index: 100; }
  header { background: #1a1410; color: #f5f0e8; padding: 16px 20px 12px; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  header h1 { font-family: var(--serif); font-size: 1.6rem; font-weight: normal; color: #f5f0e8; }
  .stats-inline { font-size: 0.72rem; color: #c4a882; }

  /* MAP BUTTON in header */
  .map-btn {
    flex-shrink: 0;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.22);
    color: #f5f0e8;
    padding: 6px 12px;
    border-radius: 16px;
    font-family: var(--sans);
    font-size: 0.78rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    gap: 5px;
    text-decoration: none;
  }
  .map-btn:active { background: rgba(255,255,255,0.2); }

  /* AREA PILLS */
  .area-picker { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .area-picker::-webkit-scrollbar { display: none; }
  .area-pill { flex-shrink: 0; background: transparent; border: 1px solid rgba(255,255,255,0.22); color: #c4a882; padding: 6px 13px; border-radius: 20px; font-family: var(--sans); font-size: 0.74rem; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .area-pill.active { background: #8b6f47; border-color: #8b6f47; color: #fff; }
  .area-pill.all-pill.active { background: #c0392b; border-color: #c0392b; }

  /* TYPE BAR */
  .type-bar { display: flex; gap: 6px; padding: 8px 20px 9px; background: #111; border-top: 1px solid rgba(255,255,255,0.07); overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .type-bar::-webkit-scrollbar { display: none; }
  .type-btn { flex-shrink: 0; background: transparent; border: 1px solid rgba(255,255,255,0.15); color: rgba(196,168,130,0.7); padding: 5px 12px; border-radius: 14px; font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .type-btn.active { background: rgba(139,111,71,0.35); border-color: #8b6f47; color: #fff; }

  /* CONTEXT BAR */
  .context-bar { padding: 18px 20px 2px; display: flex; align-items: baseline; gap: 10px; }
  .context-area { font-family: var(--serif); font-size: 1.5rem; color: #8b6f47; }
  .context-count { font-size: 0.7rem; color: #c4a882; text-transform: uppercase; letter-spacing: 0.06em; }

  /* LIST */
  .area-section { margin: 18px 16px 0; background: #f5f0e8; }
  .area-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; padding-bottom: 7px; border-bottom: 1px solid rgba(139,111,71,0.25); }
  .area-name { font-family: var(--serif); font-size: 1.15rem; color: #8b6f47; }
  .area-count { font-size: 0.67rem; color: #c4a882; letter-spacing: 0.07em; text-transform: uppercase; }
  .items-grid { display: flex; flex-direction: column; gap: 1px; }

  /* ITEM */
  .item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 10px; border-radius: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; background: #f5f0e8; }
  .item:active { background: rgba(139,111,71,0.09) !important; }
  .item.visited { opacity: 0.38; }

  .item-check { flex-shrink: 0; width: 20px; height: 20px; border: 1.5px solid #c4a882; border-radius: 4px; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
  .item.visited .item-check { background: #6b7b5e; border-color: #6b7b5e; }

  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: 0.9rem; font-weight: 500; color: #1a1410 !important; line-height: 1.4; }
  .item-note { font-size: 0.73rem; color: #8b6f47 !important; margin-top: 2px; line-height: 1.4; font-style: italic; }

  .item-tag { flex-shrink: 0; font-size: 0.61rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 10px; margin-top: 2px; align-self: flex-start; font-weight: 600; }
  .tag-food         { background: #fef3e2; color: #b86e00; }
  .tag-museum       { background: #e8f0fe; color: #2a5cc7; }
  .tag-architecture { background: #ede8f5; color: #5a4a78; }
  .tag-walk         { background: #e6f4ea; color: #2a6e40; }
  .tag-history      { background: #fce8e6; color: #b03020; }
  .tag-art          { background: #f3e8fd; color: #6a1a90; }
  .tag-nature       { background: #e6f4ea; color: #2a6e40; }

  .empty-state { text-align: center; padding: 52px 20px; color: #c4a882; font-style: italic; font-family: var(--serif); font-size: 1.1rem; }

  /* FAB */
  .fab { position: fixed; bottom: 24px; right: 20px; width: 54px; height: 54px; border-radius: 50%; background: #c0392b; color: white; font-size: 1.7rem; line-height: 1; border: none; cursor: pointer; box-shadow: 0 4px 18px rgba(192,57,43,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; -webkit-tap-highlight-color: transparent; }
  .fab:active { transform: scale(0.92); }

  /* MODAL */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(26,20,16,0.65); z-index: 300; align-items: flex-end; justify-content: center; }
  .modal-backdrop.open { display: flex; }
  .modal { background: #f5f0e8; width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 24px 20px 36px; animation: slideUp 0.22s ease; }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-handle { width: 36px; height: 4px; background: rgba(139,111,71,0.25); border-radius: 2px; margin: 0 auto 20px; }
  .modal h2 { font-family: var(--serif); font-size: 1.4rem; color: #8b6f47; margin-bottom: 18px; font-weight: normal; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: #8b6f47; margin-bottom: 5px; }
  .field input, .field textarea, .field select { width: 100%; background: white; border: 1px solid rgba(139,111,71,0.25); border-radius: 8px; padding: 10px 12px; font-family: var(--sans); font-size: 16px; color: #1a1410; outline: none; -webkit-appearance: none; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: #8b6f47; }
  .field textarea { resize: none; height: 68px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-cancel { flex: 1; padding: 12px; border: 1px solid rgba(139,111,71,0.25); border-radius: 10px; background: transparent; font-family: var(--sans); font-size: 0.85rem; color: #8b6f47; cursor: pointer; }
  .btn-save { flex: 2; padding: 12px; border: none; border-radius: 10px; background: #c0392b; font-family: var(--sans); font-size: 0.85rem; font-weight: 500; color: white; cursor: pointer; }


  /* MAP PANEL */
  .map-panel { display: none; position: fixed; inset: 0; z-index: 250; flex-direction: column; }
  .map-panel.open { display: flex; }
  .map-panel-header { background: #1a1410; color: #f5f0e8; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .map-panel-header h2 { font-family: Georgia, serif; font-size: 1.1rem; font-weight: normal; }
  .map-close { background: rgba(255,255,255,0.12); border: none; color: #f5f0e8; padding: 6px 14px; border-radius: 14px; font-size: 0.8rem; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #the-map { flex: 1; width: 100%; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1a1410; color: #f5f0e8; padding: 9px 18px; border-radius: 20px; font-size: 0.78rem; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 400; max-width: calc(100vw - 32px); width: max-content; text-align: center; line-height: 1.35; }
  .toast.show { opacity: 1; }

  /* MODAL scrolls when the keyboard is up or the picker is long */
  .modal { max-height: 92vh; max-height: 92dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  /* LOCATION PICKER */
  .loc-picker [hidden] { display: none !important; }
  .loc-picker input.loc-q { font-size: 16px; }
  .loc-status { font-size: 0.75rem; color: #6e5636; margin: 6px 2px 0; min-height: 1em; }
  .loc-results { display: flex; flex-direction: column; margin-top: 4px; border-radius: 8px; overflow: hidden; }
  .loc-results:not(:empty) { border: 1px solid rgba(139,111,71,0.25); background: #fff; }
  .loc-result { display: block; width: 100%; text-align: left; background: #fff; border: none; border-bottom: 1px solid rgba(139,111,71,0.15); padding: 10px 12px; min-height: 48px; font-family: var(--sans); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .loc-result:last-child { border-bottom: none; }
  .loc-result:active { background: rgba(139,111,71,0.09); }
  .loc-result-name { display: block; font-size: 0.92rem; color: #1a1410; font-weight: 500; }
  .loc-result-addr { display: block; font-size: 0.75rem; color: #6e5636; margin-top: 2px; }
  .loc-actions { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 4px; }
  .loc-link { background: none; border: none; color: #a5281b; font-family: var(--sans); font-size: 0.82rem; padding: 10px 2px; min-height: 44px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .loc-chosen { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid rgba(139,111,71,0.25); border-radius: 8px; padding: 6px 6px 6px 12px; }
  .loc-chosen-body { flex: 1; min-width: 0; }
  .loc-chosen-name { font-size: 0.9rem; color: #1a1410; font-weight: 500; }
  .loc-chosen-addr { font-size: 0.75rem; color: #6e5636; margin-top: 2px; overflow-wrap: anywhere; }
  .item-flag { display: inline-block; font-size: 0.62rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: #a5281b; border: 1px solid rgba(192,57,43,0.4); border-radius: 8px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }

  /* MAP BAR */
  .map-bar { background: #2a211b; color: #f5f0e8; font-size: 0.78rem; line-height: 1.4; padding: 8px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0; }
  .map-bar[hidden] { display: none; }
  .map-bar-btn { background: #c0392b; color: #fff; border: none; border-radius: 16px; padding: 8px 14px; min-height: 36px; font-family: var(--sans); font-size: 0.78rem; font-weight: 600; cursor: pointer; }
  .toast.has-action { pointer-events: auto; display: flex; align-items: center; gap: 14px; padding: 6px 6px 6px 18px; }
  .toast-action { background: rgba(255,255,255,0.14); border: none; color: #f5f0e8; font-family: var(--sans); font-size: 0.78rem; font-weight: 600; padding: 8px 14px; border-radius: 16px; min-height: 36px; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* STORAGE PROBLEM BANNER */
  .storage-banner { margin: 16px; padding: 14px 16px; border: 1px solid #c0392b; border-radius: 10px; background: #fdf0ee; color: #1a1410; font-size: 0.85rem; line-height: 1.45; }
  .storage-banner strong { display: block; margin-bottom: 4px; color: #a5281b; }
  .storage-banner .banner-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .storage-banner button { padding: 10px 14px; min-height: 44px; border-radius: 10px; border: 1px solid #c0392b; background: #fff; color: #a5281b; font-family: var(--sans); font-size: 0.82rem; cursor: pointer; }

  /* BACKUP SHEET */
  .backup-text { font-size: 0.85rem; color: #1a1410; line-height: 1.5; margin-bottom: 14px; }
  .backup-meta { font-size: 0.75rem; color: #6e5636; margin-bottom: 16px; }
  .backup-btn { display: block; width: 100%; text-align: left; padding: 14px 16px; min-height: 48px; margin-bottom: 10px; border: 1px solid rgba(139,111,71,0.35); border-radius: 10px; background: #fff; font-family: var(--sans); font-size: 0.9rem; color: #1a1410; cursor: pointer; }
  .backup-btn small { display: block; font-size: 0.72rem; color: #6e5636; margin-top: 2px; }
  .import-review { border-top: 1px solid rgba(139,111,71,0.25); padding-top: 14px; margin-top: 6px; }
  .import-review[hidden], .backup-btn[hidden] { display: none; }
</style>
</head>
<body style="background:#f5f0e8;color:#1a1410">

<div class="map-panel" id="map-panel">
  <div class="map-panel-header">
    <h2 id="map-panel-title">All places</h2>
    <button class="map-close" onclick="closeMapPanel()">✕ Close</button>
  </div>
  <div class="map-bar" id="map-bar" hidden></div>
  <div id="the-map"></div>
</div>

<div class="sticky-top">
  <header>
    <div class="header-top">
      <div>
        <h1>London List</h1>
        <span class="stats-inline" id="stats-inline">…</span>
      </div>
      <div class="header-actions">
        <button class="map-btn" id="backup-btn" onclick="openBackupSheet()">⇅ Backup</button>
        <button class="map-btn" id="map-all-btn" onclick="openMapPanel()">🗺 Map</button>
      </div>
    </div>
    <div class="area-picker" id="area-picker"></div>
  </header>
  <div class="type-bar">
    <button class="type-btn active" onclick="setType('all',this)">All</button>
    <button class="type-btn" onclick="setType('food',this)">🍴 Food</button>
    <button class="type-btn" onclick="setType('museum',this)">🏛 Museums</button>
    <button class="type-btn" onclick="setType('architecture',this)">🏗 Architecture</button>
    <button class="type-btn" onclick="setType('walk',this)">🚶 Walks</button>
    <button class="type-btn" onclick="setType('history',this)">📜 History</button>
    <button class="type-btn" onclick="setType('art',this)">🎨 Art</button>
    <button class="type-btn" onclick="setType('nature',this)">🌿 Nature</button>
    <button class="type-btn" onclick="setType('visited',this)">✓ Visited</button>
  </div>
</div>

<div id="storage-banner"></div>
<div id="list-container"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal-backdrop" id="backup-backdrop" onclick="if (event.target === this) closeBackupSheet()">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Backup</h2>
    <p class="backup-text">Your places live only in this browser. Safari can clear them, so save a backup now and then — to Files, iCloud Drive or a note to yourself.</p>
    <p class="backup-meta" id="backup-meta"></p>
    <button class="backup-btn" onclick="exportBackup()">Save a backup<small>Exports every place as a .json file</small></button>
    <button class="backup-btn" onclick="document.getElementById('import-file').click()">Restore from a backup<small>Choose a London List .json file</small></button>
    <button class="backup-btn" id="undo-import-btn" onclick="undoImport()" hidden>Undo last import<small id="undo-import-meta"></small></button>
    <input type="file" id="import-file" accept="application/json,.json" hidden onchange="readImportFile(this)">
    <div class="import-review" id="import-review" hidden>
      <p class="backup-text" id="import-summary"></p>
      <button class="backup-btn" onclick="applyImport('merge')">Merge into my list<small>Adds new places; places already here are updated from the file</small></button>
      <button class="backup-btn" onclick="applyImport('replace')">Replace my list<small>Your current list is kept as a copy you can undo to</small></button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeBackupSheet()">Close</button>
    </div>
  </div>
</div>
<button class="fab" onclick="openModal()">+</button>

<div class="modal-backdrop" id="modal-backdrop" onclick="backdropClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Add a place</h2>
    <div class="field">
      <label for="f-name">Name *</label>
      <input type="text" id="f-name" placeholder="e.g. Rochelle Canteen" autocomplete="off" autocapitalize="words">
    </div>
    <div class="field">
      <label>Location</label>
      <div id="f-loc" class="loc-picker"></div>
    </div>
    <div class="field">
      <label for="f-area">Area</label>
      <select id="f-area"></select>
    </div>
    <div class="field">
      <label>Category</label>
      <select id="f-tag">
        <option value="food">🍴 Food</option>
        <option value="museum">🏛 Museum</option>
        <option value="architecture">🏗 Architecture</option>
        <option value="walk">🚶 Walk</option>
        <option value="history">📜 History</option>
        <option value="art">🎨 Art</option>
        <option value="nature">🌿 Nature</option>
      </select>
    </div>
    <div class="field">
      <label>Note <span style="opacity:0.5;font-size:0.65rem;text-transform:none;letter-spacing:0">(why visit · address · where you saw it)</span></label>
      <textarea id="f-note" placeholder="e.g. Stunning 1930s interior · Arnold Circus · via @LookupLondon"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="savePlace()">Save place</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="edit-modal-backdrop" onclick="backdropClickEdit(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Edit place</h2>
    <div class="field">
      <label for="e-name">Name</label>
      <input type="text" id="e-name" autocomplete="off" autocapitalize="words">
    </div>
    <div class="field">
      <label>Location</label>
      <div id="e-loc" class="loc-picker"></div>
    </div>
    <div class="field">
      <label for="e-area">Area</label>
      <select id="e-area"></select>
    </div>
    <div class="field">
      <label>Category</label>
      <select id="e-tag">
        <option value="food">🍴 Food</option>
        <option value="museum">🏛 Museum</option>
        <option value="architecture">🏗 Architecture</option>
        <option value="walk">🚶 Walk</option>
        <option value="history">📜 History</option>
        <option value="art">🎨 Art</option>
        <option value="nature">🌿 Nature</option>
      </select>
    </div>
    <div class="field">
      <label>Note</label>
      <textarea id="e-note"></textarea>
    </div>
    <div class="modal-actions" style="justify-content:space-between">
      <button class="btn-cancel" onclick="deleteFromEdit()" style="color:#c0392b;border-color:#c0392b">Delete</button>
      <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
      <button class="btn-save" onclick="saveEdit()" style="flex:none;padding:12px 24px">Save</button>
    </div>
  </div>
</div>

<script>
const AREA_COORDS = {
  "City & Clerkenwell":        [51.5194, -0.1010],
  "Holborn & Bloomsbury":      [51.5175, -0.1190],
  "Covent Garden & Strand":    [51.5117, -0.1240],
  "Soho & Chinatown":          [51.5130, -0.1310],
  "Westminster & Pimlico":     [51.4975, -0.1357],
  "South Bank & Waterloo":     [51.5055, -0.1132],
  "Southwark & Elephant":      [51.4950, -0.0930],
  "Kensington & Notting Hill": [51.5074, -0.1964],
  "Chelsea":                   [51.4875, -0.1687],
  "Chiswick & West":           [51.4927, -0.2682],
  "Marylebone & Regent's Park":[51.5237, -0.1585],
  "Kings Cross":               [51.5308, -0.1238],
  "Camden & Primrose Hill":    [51.5410, -0.1460],
  "Hampstead & Highgate":      [51.5620, -0.1620],
  "Shoreditch & Whitechapel":  [51.5220, -0.0720],
  "Islington":                 [51.5362, -0.1033],
  "Finsbury Park & Holloway":  [51.5642, -0.1064],
  "Stoke Newington":           [51.5636, -0.0740],
  "Hackney & Bethnal Green":   [51.5362, -0.0555],
  "Brixton & Tooting":         [51.4620, -0.1140],
  "Peckham & Camberwell":      [51.4735, -0.0693],
  "Greenwich & Deptford":      [51.4769, -0.0122],
  "Anywhere (Underground)":    [51.5074, -0.1278],
};

const SEED = [
  { area: "City & Clerkenwell", name: "St Bartholomew Hospital Museum", note: "North Wing hall & staircase — Mon, Tue & first Sun of month", tags: ["museum","history"] },
  { area: "City & Clerkenwell", name: "Bunhill Row", note: "Named after burial mounds and windmills from the 1500s", tags: ["history"] },
  { area: "City & Clerkenwell", name: "Petty France", note: "Named after a Huguenot community; French spoken here in the 16th c.", tags: ["history"] },

// ── STORAGE ───────────────────────────────────────────────────────────────────
// Saved shape (schema v4): { version: 4, savedAt: ISO string, places: [...] }
// A place: { id, area, name, note, tags[], visited, lat, lon, address, locCheck }
//   lat/lon/address are null when the place has no location yet;
//   locCheck is true when an automatic lookup couldn't decide and you need to choose.
// v3 had no location fields; v4 adds them (as null) on load.
// v2 (key 'll-places-v2') was a bare array of places; it is migrated on first
// load and the old key is left untouched as a fallback copy.
const SCHEMA_VERSION = 4;
const STORE_KEY      = 'll-data';
const LEGACY_KEYS    = ['ll-places-v2'];
const BACKUP_KEY     = 'll-backup';       // copy of the list taken before an import
const DAMAGED_KEY    = 'll-damaged';      // unreadable data kept aside, never overwritten
const LAST_EXPORT_KEY = 'll-last-export';
const MAX_NAME = 200, MAX_NOTE = 2000;

// When saved data can't be read, saving is blocked so nothing overwrites it.
let storageProblem = null; // null | { message, raw }
let toastTimer;            // declared here because savePlaces() can toast during load

function storageGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
}

// Escape user-entered text before it goes into any HTML string.
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
}

function cleanText(v, max) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').trim().slice(0, max);
}

// Turn any stored or imported record into a well-formed place, or null if unusable.
function normalisePlace(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const name = cleanText(raw.name, MAX_NAME);
  if (!name) return null;
  const tags = Array.isArray(raw.tags)
    ? [...new Set(raw.tags.filter(t => typeof t === 'string' && t.trim()).map(t => t.trim().toLowerCase()))]
    : [];
  return {
    id: typeof raw.id === 'string' && raw.id ? raw.id.slice(0, 100) : '',
    area: cleanText(raw.area, 100) || 'To Sort',
    name,
    note: cleanText(raw.note, MAX_NOTE) || null,
    tags,
    visited: raw.visited === true,
    ...cleanLocation(raw),
  };
}

function cleanLocation(raw) {
  const lat = Number(raw.lat), lon = Number(raw.lon);
  const ok = raw.lat !== null && raw.lat !== undefined && raw.lon !== null && raw.lon !== undefined &&
    Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
  return {
    lat: ok ? Math.round(lat * 1e6) / 1e6 : null,
    lon: ok ? Math.round(lon * 1e6) / 1e6 : null,
    address: ok ? (cleanText(raw.address, 200) || null) : null,
    locCheck: !ok && raw.locCheck === true,
  };
}
function hasLocation(p) { return Number.isFinite(p.lat) && Number.isFinite(p.lon); }

// Normalise a list: drop unusable records and make sure every id is unique.
function normaliseList(list) {
  const seen = new Set();
  const out = [];
  let skipped = 0;
  list.forEach((raw, i) => {
    const p = normalisePlace(raw);
    if (!p) { skipped++; return; }
    let id = p.id || `p-${Date.now().toString(36)}-${i}`;
    while (seen.has(id)) id += '-' + i;
    seen.add(id); p.id = id;
    out.push(p);
  });
  return { places: out, skipped };
}

// Accepts any known saved/exported shape and returns { places, skipped }.
// Throws if the data isn't recognisable or is from a newer version of the app.
function migrate(data) {
  let version, list;
  if (Array.isArray(data)) { version = 2; list = data; }          // v2: bare array
  else if (data && typeof data === 'object' && Array.isArray(data.places)) {
    version = Number(data.version) || 2; list = data.places;
  } else {
    throw new Error('Not a London List file');
  }
  if (version > SCHEMA_VERSION) {
    throw new Error('Saved by a newer version of London List');
  }
  // v3 → v4: location fields are added as null by normalisePlace(); nothing else changes.
  // Future migrations go here, e.g. if (version < 5) list = list.map(...);
  return normaliseList(list);
}

function seedPlaces() {
  return normaliseList(SEED.map((s, i) => ({
    id: 'seed-' + i, area: s.area, name: s.name, note: s.note || null,
    tags: s.tags || [], visited: s.visited || false,
  }))).places;
}

function loadPlaces() {
  let raw = storageGet(STORE_KEY);
  let fromLegacy = false;
  if (raw === null) {
    for (const key of LEGACY_KEYS) {
      raw = storageGet(key);
      if (raw !== null) { fromLegacy = true; break; }
    }
  }
  if (raw === null) {
    const seeded = seedPlaces();
    savePlaces(seeded);
    return seeded;
  }
  try {
    const parsed = JSON.parse(raw);
    const { places: loaded } = migrate(parsed);
    const storedVersion = Array.isArray(parsed) ? 2 : Number(parsed.version) || 2;
    if (fromLegacy || storedVersion < SCHEMA_VERSION) {
      // Keep the pre-upgrade data once, then save in the current format.
      const keepKey = 'll-before-v' + SCHEMA_VERSION;
      if (!fromLegacy && storageGet(keepKey) === null) storageSet(keepKey, raw);
      savePlaces(loaded); // (a legacy key stays as-is)
    }
    return loaded;
  } catch (e) {
    // Keep the unreadable data aside (without replacing an earlier copy) and block saving.
    if (storageGet(DAMAGED_KEY) === null) storageSet(DAMAGED_KEY, raw);
    storageProblem = { message: e instanceof SyntaxError ? 'Your saved places couldn’t be read.' : e.message, raw };
    return [];
  }
}

function savePlaces(p) {
  if (storageProblem) {
    showToast('Not saved — sort out the storage problem first');
    return false;
  }
  const ok = storageSet(STORE_KEY, JSON.stringify({
    version: SCHEMA_VERSION, savedAt: new Date().toISOString(), places: p,
  }));
  if (!ok) showToast('Couldn’t save — storage is full or blocked. Export a backup.');
  return ok;
}

let places = loadPlaces();
let activeArea = 'all';
let activeType = 'all';

function allAreas() {
  const known = new Set(AREA_ORDER);
  const extra = [...new Set(places.map(p => p.area))].filter(a => !known.has(a));
  return [...AREA_ORDER.filter(a => places.some(p => p.area === a)), ...extra];
}

// ── MAP PANEL ─────────────────────────────────────────────────────────────────
let leafletMap = null;
let leafletMarkers = [];
let locationMarker = null, locationAccuracy = null;
let mapVisible = [];

function filteredPlaces() {
  return places.filter(p => {
    if (p.visited) return false;
    if (activeArea !== 'all' && p.area !== activeArea) return false;
    if (activeType !== 'all' && activeType !== 'visited' && !(p.tags||[]).includes(activeType)) return false;
    return true;
  });
}

function openMapPanel() {
  const visible = filteredPlaces();
  if (!visible.length) { showToast('No places to show'); return; }
  mapVisible = visible;
  document.getElementById('map-panel-title').textContent = activeArea !== 'all' ? activeArea : 'All places';
  document.getElementById('map-panel').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderMapBar();

  if (!window.L) {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    script.onload = () => initMap();
    script.onerror = () => showToast('Map failed to load — check connection');
    document.head.appendChild(script);
  } else {
    initMap();
  }
}

function closeMapPanel() {
  if (leafletMap) {
    leafletMap.stopLocate();
    if (locationMarker) leafletMap.removeLayer(locationMarker);
    if (locationAccuracy) leafletMap.removeLayer(locationAccuracy);
  }
  locationMarker = locationAccuracy = null;
  document.getElementById('map-panel').classList.remove('open');
  document.body.style.overflow = '';
}

const tagDot = {
  food:'#b86e00', museum:'#2a5cc7', architecture:'#5a4a78',
  walk:'#2a6e40', history:'#b03020', art:'#6a1a90', nature:'#2a6e40'
};

function mapLinks(p) {
  const ll = `${p.lat},${p.lon}`;
  return {
    apple: `https://maps.apple.com/?ll=${ll}&q=${encodeURIComponent(p.name)}`,
    google: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ll)}`,
  };
}

function onLocationFound(e) {
  if (locationMarker) {
    locationMarker.setLatLng(e.latlng);
    locationAccuracy.setLatLng(e.latlng).setRadius(e.accuracy);
    return;
  }
  locationAccuracy = L.circle(e.latlng, {
    radius: e.accuracy, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 0.1, weight: 1
  }).addTo(leafletMap);
  const locIcon = L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid white;box-shadow:0 2px 8px rgba(26,115,232,0.6)"></div>`,
    iconSize: [16,16], iconAnchor: [8,8]
  });
  locationMarker = L.marker(e.latlng, { icon: locIcon, zIndexOffset: 1000 }).addTo(leafletMap);
}

function initMap() {
  if (!leafletMap) {
    leafletMap = L.map('the-map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(leafletMap);
    leafletMap.on('locationfound', onLocationFound); // registered once, not on every open
  }
  drawMarkers();
  if (navigator.geolocation) leafletMap.locate({ watch: true, enableHighAccuracy: true });
  setTimeout(() => leafletMap.invalidateSize(), 150);
}

function drawMarkers() {
  if (!leafletMap) return;
  leafletMarkers.forEach(m => leafletMap.removeLayer(m));
  leafletMarkers = [];
  const bounds = [];
  mapVisible.filter(hasLocation).forEach(p => {
    const tag = (p.tags||[])[0] || 'history';
    const color = tagDot[tag] || '#8b6f47';
    const links = mapLinks(p);
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:18px;height:18px;border-radius:50%;background:${color};border:2.5px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4)"></div>`,
      iconSize: [18,18], iconAnchor: [9,9]
    });
    const m = L.marker([p.lat, p.lon], { icon }).addTo(leafletMap);
    m.bindPopup(`<div style="font-family:-apple-system,sans-serif;min-width:170px">
      <div style="font-weight:600;font-size:0.9rem;color:#1a1410;margin-bottom:3px">${esc(p.name)}</div>
      ${p.address ? `<div style="font-size:0.75rem;color:#6e5636;margin-bottom:4px">${esc(p.address)}</div>` : ''}
      ${p.note ? `<div style="font-size:0.75rem;color:#6e5636;font-style:italic;margin-bottom:8px">${esc(p.note)}</div>` : ''}
      <div style="display:flex;gap:14px">
        <a href="${esc(links.apple)}" target="_blank" rel="noopener" style="color:#c0392b;font-size:0.85rem;font-weight:600;text-decoration:none;padding:6px 0">Apple Maps</a>
        <a href="${esc(links.google)}" target="_blank" rel="noopener" style="color:#c0392b;font-size:0.85rem;font-weight:600;text-decoration:none;padding:6px 0">Google Maps</a>
      </div>
    </div>`);
    leafletMarkers.push(m);
    bounds.push([p.lat, p.lon]);
  });
  if (bounds.length === 1) leafletMap.setView(bounds[0], 15);
  else if (bounds.length) leafletMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });
  else leafletMap.fitBounds([[LONDON_BBOX[1], LONDON_BBOX[0]], [LONDON_BBOX[3], LONDON_BBOX[2]]]);
}

// The strip under the map title: how many places are missing and a way to find them.
function renderMapBar() {
  const bar = document.getElementById('map-bar');
  bar.innerHTML = '';
  if (findingLocations) { bar.textContent = findingLocations; bar.hidden = false; return; }
  const located = mapVisible.filter(hasLocation).length;
  const missing = mapVisible.filter(p => !hasLocation(p) && p.area !== 'Anywhere (Underground)');
  const toCheck = missing.filter(p => p.locCheck).length;
  const toFind = missing.length - toCheck;
  bar.hidden = !missing.length;
  if (!missing.length) return;
  const text = document.createElement('span');
  text.textContent = `${located} of ${located + missing.length} on the map.` +
    (toCheck ? ` ${toCheck} ${toCheck === 1 ? 'needs' : 'need'} you to choose (marked “Location?” in the list).` : '');
  bar.appendChild(text);
  if (toFind) {
    const b = document.createElement('button');
    b.className = 'map-bar-btn';
    b.textContent = `Find ${toFind} location${toFind !== 1 ? 's' : ''}`;
    b.onclick = findLocations;
    bar.appendChild(b);
  }
}

// ── FIND LOCATIONS FOR EXISTING PLACES ────────────────────────────────────────
// Looks each place up by name. A match is accepted only if its name matches and
// it lies in (or within 2.5 km of) the place's current area; otherwise the place
// is marked "Location?" so you can pick from the edit sheet.
let findingLocations = null; // progress text while running

const NAME_STOPWORDS = new Set(['the','a','an','at','of','and','in','on','for','to','london','s','st','cafe','café','restaurant','kitchen','house','museum','gallery','market','hotel','road','street','lane']);
function nameTokens(name) {
  return new Set(name.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/['’]s\b/g, '').replace(/[^a-z0-9]+/g, ' ').trim().split(' ')
    .filter(t => t.length > 1 && !NAME_STOPWORDS.has(t)));
}
function namesMatch(placeName, resultName) {
  const a = nameTokens(placeName), b = nameTokens(resultName);
  if (!a.size || !b.size) return placeName.trim().toLowerCase() === resultName.trim().toLowerCase();
  const shared = [...a].filter(t => b.has(t)).length;
  return shared >= 2 || (shared >= 1 && shared / a.size >= 0.5);
}
// The match must be in the place's area: its postcode district is listed for that
// area, or it is within 2 km of one of the area's centre points.
function areaAgrees(p, c) {
  if (p.area === 'To Sort' || !AREA_COORDS[p.area]) return true;
  const district = postcodeDistrict(c.postcode);
  if (district && (POSTCODE_AREAS[district] || POSTCODE_AREAS[district.replace(/[A-Z]$/, '')]) === p.area) return true;
  return [AREA_COORDS[p.area], ...(AREA_EXTRA_POINTS[p.area] || [])]
    .some(([aLat, aLon]) => distanceKm(c.lat, c.lon, aLat, aLon) <= 2);
}

// "Morley Gallery — Canterbury Tales mural" → also try "Morley Gallery";
// "Giacometti's at Tate Modern" → also try "Tate Modern".
function searchTerms(name) {
  const terms = [name];
  const main = name.split(/\s+[—–-]\s+/)[0].trim();
  if (main && main !== name) terms.push(main);
  const at = main.split(/\s+at\s+/i);
  if (at.length === 2 && at[1].trim()) terms.push(at[1].trim());
  return [...new Set(terms)];
}

async function findLocations() {
  if (findingLocations) return;
  const targets = places.filter(p => !hasLocation(p) && !p.locCheck && p.area !== 'Anywhere (Underground)');
  if (!targets.length) return;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let found = 0, unsure = 0, skipped = 0, failuresInARow = 0, stopped = false;
  for (let i = 0; i < targets.length; i++) {
    const p = targets[i];
    findingLocations = `Finding locations… ${i + 1} of ${targets.length}`;
    renderMapBar();
    const terms = searchTerms(p.name);
    const accept = (list, term) => list.find(c => namesMatch(term, c.name) && areaAgrees(p, c));
    let match = null, anyAnswer = false;
    for (const term of terms) {
      try { match = accept(await searchPhoton(term, undefined, 4), term); anyAnswer = true; } catch (e) {}
      if (match) break;
      await sleep(300);
    }
    if (!match) {
      // Second opinion from Nominatim, which knows some names Photon doesn't (max 1 request a second).
      const term = terms[terms.length > 1 ? 1 : 0];
      await sleep(1100);
      try { match = accept(await searchNominatim(term), term); anyAnswer = true; } catch (e) {}
    }
    if (match) {
      p.lat = match.lat; p.lon = match.lon; p.address = match.address || null; p.locCheck = false;
      if (p.area === 'To Sort') p.area = areaFor(match.lat, match.lon, match.postcode);
      found++; failuresInARow = 0;
    } else if (anyAnswer) {
      p.locCheck = true; unsure++; failuresInARow = 0;
    } else {
      skipped++; // both services failed; left as-is so the next run tries again
      if (++failuresInARow >= 3) { stopped = true; break; }
    }
    if (i % 5 === 4) savePlaces(places); // keep progress if the app is closed midway
    await sleep(300);
  }
  findingLocations = null;
  savePlaces(places);
  buildAreaPicker(); render();
  mapVisible = filteredPlaces();
  renderMapBar(); drawMarkers();
  showToast((stopped ? 'Stopped — check your connection. ' : '') + `Found ${found}.` +
    (unsure ? ` ${unsure} ${unsure === 1 ? 'needs' : 'need'} you to choose — hold one in the list to edit.` : '') +
    (skipped && !stopped ? ` ${skipped} couldn’t be looked up; try again later.` : ''));
}

// ── AREA PICKER ───────────────────────────────────────────────────────────────
function buildAreaPicker() {
  const picker = document.getElementById('area-picker');
  picker.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'area-pill all-pill' + (activeArea === 'all' ? ' active' : '');
  all.textContent = 'All areas';
  all.onclick = () => setArea('all', all);
  picker.appendChild(all);
  allAreas().forEach(area => {
    const btn = document.createElement('button');
    btn.className = 'area-pill' + (activeArea === area ? ' active' : '');
    btn.textContent = area; btn.dataset.area = area;
    btn.onclick = () => setArea(area, btn);
    picker.appendChild(btn);
  });
}

function setArea(area, btn) {
  if (activeArea === area && area !== 'all') {
    activeArea = 'all';
  } else {
    activeArea = area;
  }
  buildAreaPicker();
  setTimeout(() => {
    const active = document.querySelector('.area-pill.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }, 50);
  render();
}

function setType(type, btn) {
  if (activeType === type && type !== 'all') {
    // Tapping active filter — reset to all
    activeType = 'all';
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.type-btn').classList.add('active'); // first button = All
  } else {
    activeType = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  render();
}
function itemVisible(p) {
  if (activeType === 'visited') return p.visited;
  if (p.visited) return false;
  if (activeType !== 'all' && !(p.tags||[]).includes(activeType)) return false;
  return true;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  renderStorageBanner();
  const container = document.getElementById('list-container');
  container.innerHTML = '';

  const active = places.filter(p => !p.visited);
  const visited = places.filter(p => p.visited);
  document.getElementById('stats-inline').textContent = `${active.length} to go · ${visited.length} visited`;

  const areas = activeArea === 'all' ? allAreas() : [activeArea];

  if (activeArea !== 'all') {
    const count = places.filter(p => p.area === activeArea && itemVisible(p)).length;
    const bar = document.createElement('div');
    bar.className = 'context-bar';
    bar.innerHTML = `<span class="context-area">${esc(activeArea)}</span><span class="context-count">${count} place${count !== 1 ? 's' : ''}</span>`;
    container.appendChild(bar);
  }

  let anyItems = false;
  areas.forEach(area => {
    const areaPlaces = places.filter(p => p.area === area && itemVisible(p));
    if (!areaPlaces.length) return;
    anyItems = true;
    const sec = document.createElement('div');
    sec.className = 'area-section';
    if (activeArea === 'all') {
      const hdr = document.createElement('div');
      hdr.className = 'area-header';
      hdr.innerHTML = `<span class="area-name">${esc(area)}</span><span class="area-count">${areaPlaces.length} to go</span>`;
      sec.appendChild(hdr);
    }
    const grid = document.createElement('div');
    grid.className = 'items-grid';
    areaPlaces.forEach(p => renderItem(grid, p));
    sec.appendChild(grid);
    container.appendChild(sec);
  });

  if (!anyItems && !storageProblem) {
    const msg = activeType === 'visited' ? 'No visited places yet' : 'Nothing here — tap + to add a place';
    container.innerHTML += `<div class="empty-state">${msg}</div>`;
  }
}

function renderItem(grid, p) {
  const el = document.createElement('div');
  el.className = `item${p.visited ? ' visited' : ''}`;
  const tagHtml = (p.tags||[]).slice(0,1).map(t =>
    `<span class="item-tag ${tagColors[t]||''}">${esc(t)}</span>`
  ).join('');
  el.innerHTML = `
    <div class="item-check">${p.visited ? '✓' : ''}</div>
    <div class="item-body">
      <div class="item-name">${esc(p.name)}${p.locCheck ? ' <span class="item-flag">Location?</span>' : ''}</div>
      ${p.note ? `<div class="item-note">${esc(p.note)}</div>` : ''}
    </div>
    ${tagHtml}
  `;
  // Tap = toggle visited. Hold (600 ms, finger kept still) = edit, and the
  // click that follows the hold is swallowed so it doesn't also toggle visited.
  let pressTimer = null, startX = 0, startY = 0, longPressed = false;
  const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; };
  el.addEventListener('pointerdown', e => {
    longPressed = false;
    startX = e.clientX; startY = e.clientY;
    cancelPress();
    pressTimer = setTimeout(() => {
      pressTimer = null;
      longPressed = true;
      if (navigator.vibrate) navigator.vibrate(10);
      openEditModal(p.id);
    }, 600);
  });
  el.addEventListener('pointermove', e => {
    // Allow small finger wobble; a real drag (e.g. scrolling) cancels the hold.
    if (pressTimer && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) cancelPress();
  });
  el.addEventListener('pointerup', cancelPress);
  el.addEventListener('pointercancel', cancelPress);
  el.addEventListener('pointerleave', cancelPress);
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('click', e => {
    if (longPressed) { longPressed = false; e.preventDefault(); return; }
    toggleVisited(p.id);
  });
  grid.appendChild(el);
}

function toggleVisited(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  p.visited = !p.visited;
  savePlaces(places);
  render();
  // The place disappears from the current list, so offer a real Undo.
  showToast(p.visited ? `“${p.name}” marked visited` : `“${p.name}” back on your list`, {
    label: 'Undo',
    onAction: () => { p.visited = !p.visited; savePlaces(places); render(); },
  });
}

// showToast(msg) or showToast(msg, { label: 'Undo', onAction: fn })
function showToast(msg, action) {
  const t = document.getElementById('toast');
  t.textContent = '';
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  t.classList.toggle('has-action', !!action);
  if (action) {
    const b = document.createElement('button');
    b.className = 'toast-action';
    b.textContent = action.label;
    b.onclick = () => { hideToast(); action.onAction(); };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 5000 : 2500);
}
function hideToast() {
  const t = document.getElementById('toast');
  t.classList.remove('show', 'has-action');
}

// ── LOCATIONS ─────────────────────────────────────────────────────────────────
// Lookups use free services that need no key: Photon (search as you type),
// Nominatim ("Search harder"), postcodes.io (postcodes and "I'm here now").
const LONDON_BBOX = [-0.51, 51.28, 0.33, 51.69]; // west, south, east, north
const AREA_MAX_KM = 3; // further than this from every area centre → To Sort

// Postcode district → area, for districts that sit clearly in one area.
// Anything not listed falls back to the nearest area centre.
const POSTCODE_AREAS = {
  'EC1':'City & Clerkenwell', 'EC2':'City & Clerkenwell', 'EC3':'City & Clerkenwell', 'EC4':'City & Clerkenwell',
  'EC2A':'Shoreditch & Whitechapel', 'E1':'Shoreditch & Whitechapel', 'E1W':'Shoreditch & Whitechapel',
  'WC1':'Holborn & Bloomsbury', 'WC2A':'Holborn & Bloomsbury', 'WC1X':'Kings Cross', 'WC2':'Covent Garden & Strand',
  'W1B':'Soho & Chinatown', 'W1D':'Soho & Chinatown', 'W1F':'Soho & Chinatown',
  'W1G':"Marylebone & Regent's Park", 'W1H':"Marylebone & Regent's Park", 'W1U':"Marylebone & Regent's Park",
  'W1W':"Marylebone & Regent's Park", 'NW8':"Marylebone & Regent's Park",
  'SW1':'Westminster & Pimlico',
  'SE11':'Southwark & Elephant', 'SE17':'Southwark & Elephant',
  'W2':'Kensington & Notting Hill', 'W8':'Kensington & Notting Hill', 'W10':'Kensington & Notting Hill',
  'W11':'Kensington & Notting Hill', 'W14':'Kensington & Notting Hill', 'SW5':'Kensington & Notting Hill',
  'SW7':'Kensington & Notting Hill',
  'SW3':'Chelsea', 'SW10':'Chelsea',
  'W3':'Chiswick & West', 'W4':'Chiswick & West', 'W5':'Chiswick & West', 'W6':'Chiswick & West',
  'W12':'Chiswick & West', 'TW8':'Chiswick & West',
  'N1C':'Kings Cross', 'N1':'Islington',
  'NW3':'Hampstead & Highgate', 'N6':'Hampstead & Highgate',
  'N4':'Finsbury Park & Holloway', 'N5':'Finsbury Park & Holloway', 'N7':'Finsbury Park & Holloway',
  'N19':'Finsbury Park & Holloway', 'N16':'Stoke Newington',
  'E2':'Hackney & Bethnal Green', 'E5':'Hackney & Bethnal Green', 'E8':'Hackney & Bethnal Green', 'E9':'Hackney & Bethnal Green',
  'SW2':'Brixton & Tooting', 'SW4':'Brixton & Tooting', 'SW9':'Brixton & Tooting', 'SW12':'Brixton & Tooting',
  'SW17':'Brixton & Tooting',
  'SE5':'Peckham & Camberwell', 'SE15':'Peckham & Camberwell', 'SE22':'Peckham & Camberwell',
  'SE8':'Greenwich & Deptford', 'SE10':'Greenwich & Deptford',
};

// Distance in km. (Degrees of longitude are much shorter than degrees of
// latitude at London's latitude; ignoring that put Tooting in Chelsea.)
function distanceKm(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(a));
}

function postcodeDistrict(postcode) {
  const pc = String(postcode || '').toUpperCase().replace(/\s+/g, '');
  const m = pc.match(/^([A-Z]{1,2}\d[A-Z\d]?)\d[A-Z]{2}$/);
  return m ? m[1] : null;
}

// Some areas join two neighbourhoods, so they get a second centre point.
const AREA_EXTRA_POINTS = {
  'Brixton & Tooting':        [[51.4613, -0.1156], [51.4275, -0.1680]],
  'Peckham & Camberwell':     [[51.4740, -0.0920]],
  'Greenwich & Deptford':     [[51.4787, -0.0262], [51.4826, 0.0077]],
  'Chiswick & West':          [[51.4920, -0.2230], [51.5050, -0.2240]],
  'Hackney & Bethnal Green':  [[51.5450, -0.0553], [51.5270, -0.0550]],
  'Kensington & Notting Hill':[[51.4966, -0.1760]],
};

function nearestArea(lat, lon) {
  let best = null, bestKm = Infinity;
  for (const [area, centre] of Object.entries(AREA_COORDS)) {
    if (area === 'Anywhere (Underground)') continue;
    for (const [aLat, aLon] of [centre, ...(AREA_EXTRA_POINTS[area] || [])]) {
      const km = distanceKm(lat, lon, aLat, aLon);
      if (km < bestKm) { bestKm = km; best = area; }
    }
  }
  return { area: best, km: bestKm };
}

// Work out the area for a location: postcode district first, then nearest centre.
function areaFor(lat, lon, postcode) {
  const district = postcodeDistrict(postcode);
  if (district) {
    if (POSTCODE_AREAS[district]) return POSTCODE_AREAS[district];
    const shorter = district.replace(/[A-Z]$/, ''); // SW1W → SW1, EC1V → EC1
    if (/\d$/.test(shorter) && POSTCODE_AREAS[shorter]) return POSTCODE_AREAS[shorter];
  }
  const { area, km } = nearestArea(lat, lon);
  return km <= AREA_MAX_KM ? area : 'To Sort';
}

function inLondon(lat, lon) {
  return lon >= LONDON_BBOX[0] && lon <= LONDON_BBOX[2] && lat >= LONDON_BBOX[1] && lat <= LONDON_BBOX[3];
}

// Coordinates from a pasted Apple Maps or Google Maps link, if it contains them.
function coordsFromLink(text) {
  let t = String(text || '');
  try { t = decodeURIComponent(t); } catch (e) {}
  const patterns = [
    /!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,                                     // Google place data
    /[?&](?:ll|sll|q|query|center|daddr|destination)=(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/, // Apple/Google params
    /@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/,                                         // Google map view
  ];
  for (const re of patterns) {
    const m = t.match(re);
    if (m) {
      const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
      if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return { lat, lon };
    }
  }
  return null;
}

const POSTCODE_RE = /^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i;

// fetch JSON, giving up after 10 s. A cancel from the caller throws AbortError;
// a timeout throws a normal Error so callers treat it as a failed lookup.
async function fetchJson(url, signal, timeoutMs = 10000) {
  const ctrl = new AbortController();
  let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, timeoutMs);
  const onAbort = () => ctrl.abort();
  if (signal) { if (signal.aborted) ctrl.abort(); else signal.addEventListener('abort', onAbort); }
  try {
    const res = await fetch(url, { signal: ctrl.signal, headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    if (timedOut) throw new Error('Timed out');
    throw e;
  } finally {
    clearTimeout(timer);
    if (signal) signal.removeEventListener('abort', onAbort);
  }
}

function photonCandidate(f) {
  const p = f.properties || {};
  const [lon, lat] = f.geometry.coordinates;
  const street = [p.housenumber, p.street].filter(Boolean).join(' ');
  const name = p.name || street || p.district || p.city || 'Unnamed place';
  const parts = [street && street !== name ? street : null, p.district || p.locality || null, p.postcode || null];
  return { name, address: [...new Set(parts.filter(Boolean))].join(', '), lat, lon, postcode: p.postcode || null };
}

async function searchPhoton(text, signal, limit = 6) {
  const url = 'https://photon.komoot.io/api/?' + new URLSearchParams({
    q: text, limit: String(limit), lang: 'en', bbox: LONDON_BBOX.join(','),
    lat: '51.5074', lon: '-0.1278', // prefer central London when names are ambiguous
  });
  const data = await fetchJson(url, signal);
  return (data.features || []).map(photonCandidate).filter(c => inLondon(c.lat, c.lon));
}

async function searchNominatim(text, signal) {
  const [w, s, e, n] = LONDON_BBOX;
  const url = 'https://nominatim.openstreetmap.org/search?' + new URLSearchParams({
    q: text, format: 'jsonv2', limit: '6', addressdetails: '1', bounded: '1',
    viewbox: `${w},${n},${e},${s}`, 'accept-language': 'en',
  });
  const data = await fetchJson(url, signal);
  return data.map(r => {
    const a = r.address || {};
    const street = [a.house_number, a.road].filter(Boolean).join(' ');
    const name = r.name || street || r.display_name.split(',')[0];
    const parts = [street && street !== name ? street : null, a.suburb || a.neighbourhood || a.city_district || null, a.postcode || null];
    return { name, address: [...new Set(parts.filter(Boolean))].join(', '), lat: parseFloat(r.lat), lon: parseFloat(r.lon), postcode: a.postcode || null };
  });
}

async function lookupPostcode(pc, signal) {
  const data = await fetchJson('https://api.postcodes.io/postcodes/' + encodeURIComponent(pc.replace(/\s+/g, '')), signal);
  const r = data.result;
  return { name: 'Postcode ' + r.postcode, address: [r.admin_ward, r.admin_district].filter(Boolean).join(', '), lat: r.latitude, lon: r.longitude, postcode: r.postcode };
}

async function postcodeNear(lat, lon) {
  try {
    const data = await fetchJson(`https://api.postcodes.io/postcodes?lon=${lon}&lat=${lat}&limit=1&radius=300`);
    return data.result && data.result[0] ? data.result[0].postcode : null;
  } catch (e) { return null; }
}

function locationLabel(loc) {
  return loc.address || `${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}`;
}

// A search box with results, "I'm here now" and "Search harder", used in the
// add and edit sheets. opts.onChange(location|null) fires when a match is chosen or removed.
function createLocationPicker(root, opts) {
  root.innerHTML = `
    <div class="loc-chosen" hidden>
      <div class="loc-chosen-body"><div class="loc-chosen-name"></div><div class="loc-chosen-addr"></div></div>
      <button type="button" class="loc-link loc-change">Change</button>
    </div>
    <div class="loc-search">
      <input type="search" class="loc-q" placeholder="Name, address, postcode or Maps link" autocomplete="off" autocapitalize="words" enterkeyhint="search" aria-label="Search for the location">
      <div class="loc-status" aria-live="polite"></div>
      <div class="loc-results"></div>
      <div class="loc-actions">
        <button type="button" class="loc-link loc-here">◎ I’m here now</button>
        <button type="button" class="loc-link loc-harder">Search harder</button>
        <button type="button" class="loc-link loc-remove" hidden>No location</button>
      </div>
    </div>`;
  const $ = sel => root.querySelector(sel);
  const q = $('.loc-q'), results = $('.loc-results'), status = $('.loc-status');
  const chosenBox = $('.loc-chosen'), searchBox = $('.loc-search');
  let chosen = null, reqId = 0, timer = null, ctrl = null, typed = false, previous = null;

  const setStatus = t => { status.textContent = t || ''; };

  function showChosen() {
    chosenBox.hidden = !chosen;
    searchBox.hidden = !!chosen;
    if (chosen) {
      $('.loc-chosen-name').textContent = '📍 ' + (chosen.name || 'Location');
      $('.loc-chosen-addr').textContent = locationLabel(chosen);
    }
  }

  function choose(loc) {
    chosen = loc ? { lat: loc.lat, lon: loc.lon, address: loc.address || null, postcode: loc.postcode || null, name: loc.name || '' } : null;
    results.innerHTML = ''; setStatus('');
    showChosen();
    opts.onChange(chosen);
  }

  function renderCandidates(list) {
    results.innerHTML = '';
    list.forEach(c => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'loc-result';
      const n = document.createElement('span'); n.className = 'loc-result-name'; n.textContent = c.name;
      const a = document.createElement('span'); a.className = 'loc-result-addr';
      a.textContent = [c.address, areaFor(c.lat, c.lon, c.postcode)].filter(Boolean).join(' · ');
      b.append(n, a);
      b.onclick = () => choose(c);
      results.appendChild(b);
    });
  }

  async function run(text, deep) {
    text = (text || '').trim();
    const id = ++reqId;
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    if (text.length < 3) { results.innerHTML = ''; setStatus(''); return; }

    if (/^https?:\/\//i.test(text) || /maps\.(apple|google)|goo\.gl|maps\.app/i.test(text)) {
      const c = coordsFromLink(text);
      if (c) {
        setStatus('Reading link…');
        const postcode = await postcodeNear(c.lat, c.lon);
        if (id !== reqId) return;
        renderCandidates([{ name: 'Location from link', address: postcode ? 'Near ' + postcode : '', ...c, postcode }]);
        setStatus('');
      } else {
        results.innerHTML = '';
        setStatus('That link doesn’t include a location. Search by name or postcode instead.');
      }
      return;
    }

    setStatus(deep ? 'Searching harder…' : 'Searching…');
    const found = [];
    try {
      if (POSTCODE_RE.test(text)) found.push(await lookupPostcode(text, ctrl.signal));
    } catch (e) { if (e.name === 'AbortError') return; }
    try {
      found.push(...await (deep ? searchNominatim(text, ctrl.signal) : searchPhoton(text, ctrl.signal)));
    } catch (e) {
      if (e.name === 'AbortError') return;
      if (id === reqId && !found.length) { results.innerHTML = ''; setStatus('Couldn’t search — check your connection.'); return; }
    }
    if (id !== reqId) return;
    const seen = new Set();
    const unique = found.filter(c => {
      const k = c.name.toLowerCase() + '|' + c.lat.toFixed(4) + '|' + c.lon.toFixed(4);
      if (seen.has(k)) return false; seen.add(k); return true;
    });
    renderCandidates(unique);
    setStatus(unique.length ? 'Tap the right one:' :
      deep ? 'Still nothing in London. Try an address or postcode.' : 'No matches in London. Try Search harder, an address or a postcode.');
  }

  function schedule(text) {
    clearTimeout(timer);
    timer = setTimeout(() => run(text, false), 350);
  }

  q.addEventListener('input', () => { typed = true; schedule(q.value); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(timer); run(q.value, false); } });
  $('.loc-harder').onclick = () => { clearTimeout(timer); run(q.value || opts.getName(), true); };
  $('.loc-change').onclick = () => {
    previous = chosen;
    chosen = null; showChosen();
    $('.loc-remove').hidden = false;
    if (!q.value) q.value = opts.getName();
    run(q.value, false).then(() => { if (previous && !results.children.length) setStatus('Your current location is kept unless you pick a new one.'); });
    q.focus();
  };
  $('.loc-remove').onclick = () => { previous = null; choose(null); setStatus('Saved without a location.'); };
  $('.loc-here').onclick = () => {
    if (!navigator.geolocation) { setStatus('Location isn’t available on this device.'); return; }
    setStatus('Finding where you are…');
    navigator.geolocation.getCurrentPosition(async pos => {
      const { latitude: lat, longitude: lon, accuracy } = pos.coords;
      const postcode = await postcodeNear(lat, lon);
      choose({ name: 'Where I was standing', lat, lon, postcode,
        address: (postcode ? 'Near ' + postcode : '') + (accuracy > 100 ? ` (accurate to about ${Math.round(accuracy)} m)` : '') });
    }, err => {
      setStatus(err.code === 1 ? 'Location permission is off for this site. Allow it in Settings → Safari → Location.' : 'Couldn’t get your location. Try again outside or search instead.');
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  };

  return {
    // Fill the search from the place name, unless the user has typed their own search.
    followName(name) { if (!typed && !chosen) { q.value = name; schedule(name); } },
    reset(loc, name) {
      clearTimeout(timer); if (ctrl) ctrl.abort(); reqId++;
      typed = false; previous = null;
      results.innerHTML = ''; setStatus('');
      $('.loc-remove').hidden = true;
      q.value = '';
      chosen = loc && loc.lat !== null && loc.lat !== undefined ? { ...loc } : null;
      showChosen();
      if (!chosen && name) { q.value = name; run(name, false); }
    },
    // While changing, the old location is kept until a new one is picked or removed.
    get value() { return chosen || previous; },
  };
}

function fillAreaSelect(sel, current) {
  sel.innerHTML = '';
  const areas = [...new Set([...AREA_ORDER, ...places.map(x => x.area), 'To Sort'])];
  if (current && !areas.includes(current)) areas.push(current);
  areas.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    opt.selected = a === current;
    sel.appendChild(opt);
  });
}

// ── ADD MODAL ─────────────────────────────────────────────────────────────────
let addPicker = null, editPicker = null;

function nameStartsLike(typed, suggestion) {
  const a = typed.trim().toLowerCase(), b = suggestion.toLowerCase();
  return !a || (b.startsWith(a) && b !== a);
}

function updateAddSaveLabel() {
  document.querySelector('#modal-backdrop .btn-save').textContent =
    addPicker.value ? 'Save place' : 'Save without location';
}

function openModal() {
  ['f-name','f-note'].forEach(id => document.getElementById(id).value = '');
  fillAreaSelect(document.getElementById('f-area'), 'To Sort');
  addPicker.reset(null, '');
  updateAddSaveLabel();
  document.getElementById('modal-backdrop').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 250);
}
function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }
function backdropClick(e) { if (e.target === document.getElementById('modal-backdrop')) closeModal(); }

function savePlace() {
  const nameEl = document.getElementById('f-name');
  const name = cleanText(nameEl.value, MAX_NAME);
  const note = cleanText(document.getElementById('f-note').value, MAX_NOTE);
  const tag  = document.getElementById('f-tag').value;
  if (!name) { nameEl.focus(); showToast('Add a name first'); return; }
  const loc = addPicker.value;
  const area = document.getElementById('f-area').value || 'To Sort';
  const dupe = places.find(p => placeKey(p) === placeKey({ name, area }));
  if (dupe && !confirm(`“${dupe.name}” is already in ${area}. Add it again?`)) return;
  places.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    area, name, note: note || null, tags: [tag], visited: false,
    lat: loc ? loc.lat : null, lon: loc ? loc.lon : null,
    address: loc ? (loc.address || null) : null, locCheck: false,
  });
  if (!savePlaces(places)) return;
  closeModal(); activeArea = area;
  buildAreaPicker(); render();
  showToast(loc ? `Saved to ${area}` : `Saved to ${area} without a location`);
  setTimeout(() => {
    const pill = document.querySelector(`.area-pill[data-area="${CSS.escape(area)}"]`);
    if (pill) pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }, 120);
}

// ── EDIT MODAL ────────────────────────────────────────────────────────────────
let editingId = null;

function openEditModal(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('e-name').value = p.name;
  document.getElementById('e-note').value = p.note || '';
  fillAreaSelect(document.getElementById('e-area'), p.area);
  const tagSel = document.getElementById('e-tag');
  const currentTag = (p.tags||[])[0] || 'history';
  [...tagSel.options].forEach(o => { o.selected = o.value === currentTag; });
  // With a location: show it. Without one: start searching for the name straight away.
  editPicker.reset(hasLocation(p) ? { lat: p.lat, lon: p.lon, address: p.address, name: p.name } : null,
                   hasLocation(p) || p.area === 'Anywhere (Underground)' ? '' : p.name);
  document.getElementById('edit-modal-backdrop').classList.add('open');
}

function closeEditModal() {
  document.getElementById('edit-modal-backdrop').classList.remove('open');
  editingId = null;
}

function backdropClickEdit(e) {
  if (e.target === document.getElementById('edit-modal-backdrop')) closeEditModal();
}

function saveEdit() {
  const p = places.find(x => x.id === editingId);
  if (!p) return;
  p.name = cleanText(document.getElementById('e-name').value, MAX_NAME) || p.name;
  p.area = document.getElementById('e-area').value;
  // Keep any extra categories; only the first (shown) one is edited here.
  const tags = (p.tags || []).slice();
  tags[0] = document.getElementById('e-tag').value;
  p.tags = [...new Set(tags)];
  p.note = cleanText(document.getElementById('e-note').value, MAX_NOTE) || null;
  const loc = editPicker.value;
  p.lat = loc ? loc.lat : null;
  p.lon = loc ? loc.lon : null;
  p.address = loc ? (loc.address || null) : null;
  if (loc) p.locCheck = false;
  savePlaces(places);
  closeEditModal();
  activeArea = p.area;
  buildAreaPicker();
  render();
}

function deleteFromEdit() {
  if (!confirm('Delete this place?')) return;
  places = places.filter(x => x.id !== editingId);
  savePlaces(places);
  closeEditModal();
  buildAreaPicker();
  render();
}

function setupPickers() {
  addPicker = createLocationPicker(document.getElementById('f-loc'), {
    getName: () => document.getElementById('f-name').value,
    onChange: loc => {
      if (loc) {
        document.getElementById('f-area').value = areaFor(loc.lat, loc.lon, loc.postcode);
        const nameEl = document.getElementById('f-name');
        if (loc.name && !/^(Postcode |Location from link|Where I was standing)/.test(loc.name) && nameStartsLike(nameEl.value, loc.name)) {
          nameEl.value = loc.name;
        }
      }
      updateAddSaveLabel();
    },
  });
  document.getElementById('f-name').addEventListener('input', e => addPicker.followName(e.target.value));
  editPicker = createLocationPicker(document.getElementById('e-loc'), {
    getName: () => document.getElementById('e-name').value,
    onChange: loc => {
      if (loc) {
        const sel = document.getElementById('e-area');
        const area = areaFor(loc.lat, loc.lon, loc.postcode);
        if (![...sel.options].some(o => o.value === area)) fillAreaSelect(sel, area);
        sel.value = area;
      }
    },
  });
}

// ── BACKUP: EXPORT / IMPORT ───────────────────────────────────────────────────
let pendingImport = null; // { places, skipped, fileName }

function placeKey(p) {
  const n = p.name.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  return n + '|' + p.area;
}

function formatDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) +
    ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function openBackupSheet() {
  const last = storageGet(LAST_EXPORT_KEY);
  document.getElementById('backup-meta').textContent =
    `${places.length} place${places.length !== 1 ? 's' : ''} · ` +
    (last ? `Last backup ${formatDate(last)}` : 'No backup saved from this device yet');
  refreshUndoImport();
  pendingImport = null;
  document.getElementById('import-review').hidden = true;
  document.getElementById('backup-backdrop').classList.add('open');
}
function closeBackupSheet() {
  pendingImport = null;
  document.getElementById('backup-backdrop').classList.remove('open');
}

function refreshUndoImport() {
  const btn = document.getElementById('undo-import-btn');
  let backup = null;
  try { backup = JSON.parse(storageGet(BACKUP_KEY)); } catch (e) {}
  btn.hidden = !(backup && Array.isArray(backup.places));
  if (!btn.hidden) {
    document.getElementById('undo-import-meta').textContent =
      `Go back to the ${backup.places.length} places you had on ${formatDate(backup.savedAt)}`;
  }
}

// Hand a file to the iOS share sheet (Save to Files, AirDrop…), or download it.
async function saveFile(text, fileName, type) {
  const file = new File([text], fileName, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: fileName });
      return true;
    } catch (e) {
      if (e.name === 'AbortError') return false; // user cancelled the share sheet
      // otherwise fall through to a plain download
    }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return true;
}

async function exportBackup() {
  const now = new Date();
  const payload = { app: 'london-list', version: SCHEMA_VERSION, exportedAt: now.toISOString(), places };
  const fileName = `london-list-backup-${now.toISOString().slice(0, 10)}.json`;
  const saved = await saveFile(JSON.stringify(payload, null, 2), fileName, 'application/json');
  if (saved) {
    storageSet(LAST_EXPORT_KEY, now.toISOString());
    showToast('Backup saved');
    openBackupSheet(); // refresh "last backup"
  }
}

async function readImportFile(input) {
  const file = input.files && input.files[0];
  input.value = ''; // so choosing the same file again still triggers a change
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { showToast('That file is too big to be a London List backup'); return; }
  let result;
  try {
    result = migrate(JSON.parse(await file.text()));
  } catch (e) {
    showToast(e instanceof SyntaxError ? 'That file isn’t valid JSON' : e.message);
    return;
  }
  if (!result.places.length) { showToast('No places found in that file'); return; }
  pendingImport = { ...result, fileName: file.name };
  const n = result.places.length;
  document.getElementById('import-summary').textContent =
    `“${file.name}” has ${n} place${n !== 1 ? 's' : ''}` +
    (result.skipped ? ` (${result.skipped} unreadable entr${result.skipped !== 1 ? 'ies' : 'y'} will be skipped)` : '') +
    '. What would you like to do?';
  const review = document.getElementById('import-review');
  review.hidden = false;
  review.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// True if it's safe to stop protecting unreadable data (it was set aside, or the user accepts losing it).
function okToLeaveDamagedData() {
  if (!storageProblem || storageGet(DAMAGED_KEY) !== null) return true;
  return confirm('The unreadable data couldn’t be set aside, so continuing will lose it. ' +
    'Tap Cancel and use “Download unreadable data” first if you might need it. Continue?');
}

function applyImport(mode) {
  if (!pendingImport) return;
  if (!okToLeaveDamagedData()) return;
  // Keep a copy of the current list so the import can be undone.
  const hadBackup = storageSet(BACKUP_KEY, JSON.stringify({ savedAt: new Date().toISOString(), places }));
  if (!hadBackup && places.length &&
      !confirm('Couldn’t keep a copy of your current list, so this import can’t be undone. Continue?')) return;

  const incoming = pendingImport.places;
  let message;
  if (mode === 'replace') {
    places = incoming;
    message = `Replaced with ${incoming.length} places`;
  } else {
    const byId = new Map(places.map((p, i) => [p.id, i]));
    const keys = new Set(places.map(placeKey));
    let added = 0, updated = 0, dupes = 0;
    incoming.forEach(p => {
      if (byId.has(p.id)) { places[byId.get(p.id)] = p; updated++; }
      else if (keys.has(placeKey(p))) { dupes++; }
      else { places.push(p); keys.add(placeKey(p)); added++; }
    });
    message = `Added ${added}` + (updated ? `, updated ${updated}` : '') + (dupes ? `, skipped ${dupes} already here` : '');
  }
  storageProblem = null;
  pendingImport = null;
  savePlaces(places);
  closeBackupSheet();
  activeArea = 'all';
  buildAreaPicker(); render();
  showToast(message, hadBackup ? { label: 'Undo', onAction: undoImport } : null);
}

function undoImport() {
  let restored;
  try { restored = migrate(JSON.parse(storageGet(BACKUP_KEY))).places; }
  catch (e) { showToast('No import to undo'); return; }
  places = restored;
  storageProblem = null;
  if (savePlaces(places)) { try { localStorage.removeItem(BACKUP_KEY); } catch (e) {} }
  closeBackupSheet();
  activeArea = 'all';
  buildAreaPicker(); render();
  showToast(`Back to your ${places.length} places`);
}

// ── STORAGE PROBLEM BANNER ────────────────────────────────────────────────────
function renderStorageBanner() {
  const el = document.getElementById('storage-banner');
  el.innerHTML = '';
  if (!storageProblem) return;
  const box = document.createElement('div');
  box.className = 'storage-banner';
  box.setAttribute('role', 'alert');
  const title = document.createElement('strong');
  title.textContent = storageProblem.message;
  const body = document.createElement('div');
  body.textContent = 'Nothing has been deleted, and saving is paused so it can’t be overwritten. ' +
    'Download the unreadable data to keep it, restore a backup, or start a fresh list.';
  const actions = document.createElement('div');
  actions.className = 'banner-actions';
  [['Download unreadable data', exportDamaged],
   ['Restore a backup', openBackupSheet],
   ['Start fresh', startFresh]].forEach(([label, fn]) => {
    const b = document.createElement('button');
    b.textContent = label; b.onclick = fn;
    actions.appendChild(b);
  });
  box.append(title, body, actions);
  el.appendChild(box);
}

function exportDamaged() {
  const raw = storageProblem ? storageProblem.raw : storageGet(DAMAGED_KEY);
  if (raw === null || raw === undefined) return;
  saveFile(raw, `london-list-unreadable-${new Date().toISOString().slice(0, 10)}.txt`, 'text/plain');
}

function startFresh() {
  if (!confirm('Start an empty list? The unreadable data won’t be used.')) return;
  if (!okToLeaveDamagedData()) return;
  storageProblem = null;
  places = [];
  savePlaces(places);
  buildAreaPicker(); render();
}

setupPickers();
buildAreaPicker();
render();
</script>

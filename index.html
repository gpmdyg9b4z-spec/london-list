<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>London List</title>
<style>
  :root {
    --ink: #1a1410;
    --paper: #f5f0e8;
    --sepia: #8b6f47;
    --sepia-light: #c4a882;
    --done: #6b7b5e;
    --accent: #c0392b;
    --border: rgba(139,111,71,0.25);
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; color-scheme: light; }
  html, body { background: #f5f0e8 !important; color: #1a1410 !important; }
  body { font-family: var(--sans); min-height: 100vh; padding: 0 0 90px; -webkit-text-size-adjust: 100%; }

  /* STICKY TOP */
  .sticky-top { position: sticky; top: 0; z-index: 100; }
  header { background: #1a1410; color: #f5f0e8; padding: 16px 20px 12px; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  header h1 { font-family: var(--serif); font-size: 1.6rem; font-weight: normal; color: #f5f0e8; }
  .stats-inline { font-size: 0.72rem; color: #c4a882; }

  /* MAP BUTTON in header */
  .map-btn {
    flex-shrink: 0;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.22);
    color: #f5f0e8;
    padding: 6px 12px;
    border-radius: 16px;
    font-family: var(--sans);
    font-size: 0.78rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    gap: 5px;
    text-decoration: none;
  }
  .map-btn:active { background: rgba(255,255,255,0.2); }

  /* AREA PILLS */
  .area-picker { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .area-picker::-webkit-scrollbar { display: none; }
  .area-pill { flex-shrink: 0; background: transparent; border: 1px solid rgba(255,255,255,0.22); color: #c4a882; padding: 6px 13px; border-radius: 20px; font-family: var(--sans); font-size: 0.74rem; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .area-pill.active { background: #8b6f47; border-color: #8b6f47; color: #fff; }
  .area-pill.all-pill.active { background: #c0392b; border-color: #c0392b; }

  /* TYPE BAR */
  .type-bar { display: flex; gap: 6px; padding: 8px 20px 9px; background: #111; border-top: 1px solid rgba(255,255,255,0.07); overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .type-bar::-webkit-scrollbar { display: none; }
  .type-btn { flex-shrink: 0; background: transparent; border: 1px solid rgba(255,255,255,0.15); color: rgba(196,168,130,0.7); padding: 5px 12px; border-radius: 14px; font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .type-btn.active { background: rgba(139,111,71,0.35); border-color: #8b6f47; color: #fff; }

  /* CONTEXT BAR */
  .context-bar { padding: 18px 20px 2px; display: flex; align-items: baseline; gap: 10px; }
  .context-area { font-family: var(--serif); font-size: 1.5rem; color: #8b6f47; }
  .context-count { font-size: 0.7rem; color: #c4a882; text-transform: uppercase; letter-spacing: 0.06em; }

  /* LIST */
  .area-section { margin: 18px 16px 0; background: #f5f0e8; }
  .area-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; padding-bottom: 7px; border-bottom: 1px solid rgba(139,111,71,0.25); }
  .area-name { font-family: var(--serif); font-size: 1.15rem; color: #8b6f47; }
  .area-count { font-size: 0.67rem; color: #c4a882; letter-spacing: 0.07em; text-transform: uppercase; }
  .items-grid { display: flex; flex-direction: column; gap: 1px; }

  /* ITEM */
  .item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 10px; border-radius: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; background: #f5f0e8; }
  .item:active { background: rgba(139,111,71,0.09) !important; }
  .item.visited { opacity: 0.38; }

  .item-check { flex-shrink: 0; width: 20px; height: 20px; border: 1.5px solid #c4a882; border-radius: 4px; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
  .item.visited .item-check { background: #6b7b5e; border-color: #6b7b5e; }

  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: 0.9rem; font-weight: 500; color: #1a1410 !important; line-height: 1.4; }
  .item-note { font-size: 0.73rem; color: #8b6f47 !important; margin-top: 2px; line-height: 1.4; font-style: italic; }

  .item-tag { flex-shrink: 0; font-size: 0.61rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 10px; margin-top: 2px; align-self: flex-start; font-weight: 600; }
  .tag-food         { background: #fef3e2; color: #b86e00; }
  .tag-museum       { background: #e8f0fe; color: #2a5cc7; }
  .tag-architecture { background: #ede8f5; color: #5a4a78; }
  .tag-walk         { background: #e6f4ea; color: #2a6e40; }
  .tag-history      { background: #fce8e6; color: #b03020; }
  .tag-art          { background: #f3e8fd; color: #6a1a90; }
  .tag-nature       { background: #e6f4ea; color: #2a6e40; }

  .empty-state { text-align: center; padding: 52px 20px; color: #c4a882; font-style: italic; font-family: var(--serif); font-size: 1.1rem; }

  /* FAB */
  .fab { position: fixed; bottom: 24px; right: 20px; width: 54px; height: 54px; border-radius: 50%; background: #c0392b; color: white; font-size: 1.7rem; line-height: 1; border: none; cursor: pointer; box-shadow: 0 4px 18px rgba(192,57,43,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; -webkit-tap-highlight-color: transparent; }
  .fab:active { transform: scale(0.92); }

  /* MODAL */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(26,20,16,0.65); z-index: 300; align-items: flex-end; justify-content: center; }
  .modal-backdrop.open { display: flex; }
  .modal { background: #f5f0e8; width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 24px 20px 36px; animation: slideUp 0.22s ease; }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-handle { width: 36px; height: 4px; background: rgba(139,111,71,0.25); border-radius: 2px; margin: 0 auto 20px; }
  .modal h2 { font-family: var(--serif); font-size: 1.4rem; color: #8b6f47; margin-bottom: 18px; font-weight: normal; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: #8b6f47; margin-bottom: 5px; }
  .field input, .field textarea, .field select { width: 100%; background: white; border: 1px solid rgba(139,111,71,0.25); border-radius: 8px; padding: 10px 12px; font-family: var(--sans); font-size: 0.9rem; color: #1a1410; outline: none; -webkit-appearance: none; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: #8b6f47; }
  .field textarea { resize: none; height: 68px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-cancel { flex: 1; padding: 12px; border: 1px solid rgba(139,111,71,0.25); border-radius: 10px; background: transparent; font-family: var(--sans); font-size: 0.85rem; color: #8b6f47; cursor: pointer; }
  .btn-save { flex: 2; padding: 12px; border: none; border-radius: 10px; background: #c0392b; font-family: var(--sans); font-size: 0.85rem; font-weight: 500; color: white; cursor: pointer; }


  /* MAP PANEL */
  .map-panel { display: none; position: fixed; inset: 0; z-index: 250; flex-direction: column; }
  .map-panel.open { display: flex; }
  .map-panel-header { background: #1a1410; color: #f5f0e8; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .map-panel-header h2 { font-family: Georgia, serif; font-size: 1.1rem; font-weight: normal; }
  .map-close { background: rgba(255,255,255,0.12); border: none; color: #f5f0e8; padding: 6px 14px; border-radius: 14px; font-size: 0.8rem; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #the-map { flex: 1; width: 100%; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1a1410; color: #f5f0e8; padding: 9px 18px; border-radius: 20px; font-size: 0.78rem; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 400; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .toast.has-action { pointer-events: auto; display: flex; align-items: center; gap: 14px; padding: 6px 6px 6px 18px; }
  .toast-action { background: rgba(255,255,255,0.14); border: none; color: #f5f0e8; font-family: var(--sans); font-size: 0.78rem; font-weight: 600; padding: 8px 14px; border-radius: 16px; min-height: 36px; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* STORAGE PROBLEM BANNER */
  .storage-banner { margin: 16px; padding: 14px 16px; border: 1px solid #c0392b; border-radius: 10px; background: #fdf0ee; color: #1a1410; font-size: 0.85rem; line-height: 1.45; }
  .storage-banner strong { display: block; margin-bottom: 4px; color: #a5281b; }
  .storage-banner .banner-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .storage-banner button { padding: 10px 14px; min-height: 44px; border-radius: 10px; border: 1px solid #c0392b; background: #fff; color: #a5281b; font-family: var(--sans); font-size: 0.82rem; cursor: pointer; }

  /* BACKUP SHEET */
  .backup-text { font-size: 0.85rem; color: #1a1410; line-height: 1.5; margin-bottom: 14px; }
  .backup-meta { font-size: 0.75rem; color: #6e5636; margin-bottom: 16px; }
  .backup-btn { display: block; width: 100%; text-align: left; padding: 14px 16px; min-height: 48px; margin-bottom: 10px; border: 1px solid rgba(139,111,71,0.35); border-radius: 10px; background: #fff; font-family: var(--sans); font-size: 0.9rem; color: #1a1410; cursor: pointer; }
  .backup-btn small { display: block; font-size: 0.72rem; color: #6e5636; margin-top: 2px; }
  .import-review { border-top: 1px solid rgba(139,111,71,0.25); padding-top: 14px; margin-top: 6px; }
  .import-review[hidden], .backup-btn[hidden] { display: none; }
</style>
</head>
<body style="background:#f5f0e8;color:#1a1410">

<div class="map-panel" id="map-panel">
  <div class="map-panel-header">
    <h2 id="map-panel-title">All places</h2>
    <button class="map-close" onclick="closeMapPanel()">✕ Close</button>
  </div>
  <div id="the-map"></div>
</div>

<div class="sticky-top">
  <header>
    <div class="header-top">
      <div>
        <h1>London List</h1>
        <span class="stats-inline" id="stats-inline">…</span>
      </div>
      <div class="header-actions">
        <button class="map-btn" id="backup-btn" onclick="openBackupSheet()">⇅ Backup</button>
        <button class="map-btn" id="map-all-btn" onclick="openMapPanel()">🗺 Map</button>
      </div>
    </div>
    <div class="area-picker" id="area-picker"></div>
  </header>
  <div class="type-bar">
    <button class="type-btn active" onclick="setType('all',this)">All</button>
    <button class="type-btn" onclick="setType('food',this)">🍴 Food</button>
    <button class="type-btn" onclick="setType('museum',this)">🏛 Museums</button>
    <button class="type-btn" onclick="setType('architecture',this)">🏗 Architecture</button>
    <button class="type-btn" onclick="setType('walk',this)">🚶 Walks</button>
    <button class="type-btn" onclick="setType('history',this)">📜 History</button>
    <button class="type-btn" onclick="setType('art',this)">🎨 Art</button>
    <button class="type-btn" onclick="setType('nature',this)">🌿 Nature</button>
    <button class="type-btn" onclick="setType('visited',this)">✓ Visited</button>
  </div>
</div>

<div id="storage-banner"></div>
<div id="list-container"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal-backdrop" id="backup-backdrop" onclick="if (event.target === this) closeBackupSheet()">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Backup</h2>
    <p class="backup-text">Your places live only in this browser. Safari can clear them, so save a backup now and then — to Files, iCloud Drive or a note to yourself.</p>
    <p class="backup-meta" id="backup-meta"></p>
    <button class="backup-btn" onclick="exportBackup()">Save a backup<small>Exports every place as a .json file</small></button>
    <button class="backup-btn" onclick="document.getElementById('import-file').click()">Restore from a backup<small>Choose a London List .json file</small></button>
    <button class="backup-btn" id="undo-import-btn" onclick="undoImport()" hidden>Undo last import<small id="undo-import-meta"></small></button>
    <input type="file" id="import-file" accept="application/json,.json" hidden onchange="readImportFile(this)">
    <div class="import-review" id="import-review" hidden>
      <p class="backup-text" id="import-summary"></p>
      <button class="backup-btn" onclick="applyImport('merge')">Merge into my list<small>Adds new places; places already here are updated from the file</small></button>
      <button class="backup-btn" onclick="applyImport('replace')">Replace my list<small>Your current list is kept as a copy you can undo to</small></button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeBackupSheet()">Close</button>
    </div>
  </div>
</div>
<button class="fab" onclick="openModal()">+</button>

<div class="modal-backdrop" id="modal-backdrop" onclick="backdropClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Add a place</h2>
    <div class="field">
      <label>Name *</label>
      <input type="text" id="f-name" placeholder="e.g. Rochelle Canteen" autocomplete="off">
    </div>
    <div class="field">
      <label>Category</label>
      <select id="f-tag">
        <option value="food">🍴 Food</option>
        <option value="museum">🏛 Museum</option>
        <option value="architecture">🏗 Architecture</option>
        <option value="walk">🚶 Walk</option>
        <option value="history">📜 History</option>
        <option value="art">🎨 Art</option>
        <option value="nature">🌿 Nature</option>
      </select>
    </div>
    <div class="field">
      <label>Note <span style="opacity:0.5;font-size:0.65rem;text-transform:none;letter-spacing:0">(why visit · address · where you saw it)</span></label>
      <textarea id="f-note" placeholder="e.g. Stunning 1930s interior · Arnold Circus · via @LookupLondon"></textarea>
    </div>
    <div id="f-area-status" style="font-size:0.72rem;color:#8b6f47;font-style:italic;margin-bottom:8px;min-height:1.1em;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="savePlace()">Save place</button>
    </div>
  </div>
</div>

  { area: "Anywhere (Underground)", name: "Cabmen's Shelters", note: "13 surviving green huts from 1875 — shelter and food for cab drivers", tags: ["history"] },
];

const AREA_ORDER = [
  "City & Clerkenwell","Holborn & Bloomsbury","Covent Garden & Strand",
  "Soho & Chinatown","Westminster & Pimlico","South Bank & Waterloo",
  "Southwark & Elephant","Kensington & Notting Hill","Chelsea",
  "Chiswick & West","Marylebone & Regent's Park","Kings Cross",
  "Islington","Finsbury Park & Holloway","Stoke Newington",
  "Hackney & Bethnal Green","Brixton & Tooting","Peckham & Camberwell",
  "Greenwich & Deptford","Anywhere (Underground)"
];

const tagColors = {
  food:'tag-food', museum:'tag-museum', architecture:'tag-architecture',
  walk:'tag-walk', history:'tag-history', art:'tag-art', nature:'tag-nature'
};

// ── STORAGE ───────────────────────────────────────────────────────────────────
// Saved shape (schema v3): { version: 3, savedAt: ISO string, places: [...] }
// v2 (key 'll-places-v2') was a bare array of places; it is migrated on first
// load and the old key is left untouched as a fallback copy.
const SCHEMA_VERSION = 3;
const STORE_KEY      = 'll-data';
const LEGACY_KEYS    = ['ll-places-v2'];
const BACKUP_KEY     = 'll-backup';       // copy of the list taken before an import
const DAMAGED_KEY    = 'll-damaged';      // unreadable data kept aside, never overwritten
const LAST_EXPORT_KEY = 'll-last-export';
const MAX_NAME = 200, MAX_NOTE = 2000;

// When saved data can't be read, saving is blocked so nothing overwrites it.
let storageProblem = null; // null | { message, raw }
let toastTimer;            // declared here because savePlaces() can toast during load

function storageGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
}

// Escape user-entered text before it goes into any HTML string.
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
}

function cleanText(v, max) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').trim().slice(0, max);
}

// Turn any stored or imported record into a well-formed place, or null if unusable.
function normalisePlace(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const name = cleanText(raw.name, MAX_NAME);
  if (!name) return null;
  const tags = Array.isArray(raw.tags)
    ? [...new Set(raw.tags.filter(t => typeof t === 'string' && t.trim()).map(t => t.trim().toLowerCase()))]
    : [];
  return {
    id: typeof raw.id === 'string' && raw.id ? raw.id.slice(0, 100) : '',
    area: cleanText(raw.area, 100) || 'To Sort',
    name,
    note: cleanText(raw.note, MAX_NOTE) || null,
    tags,
    visited: raw.visited === true,
  };
}

// Normalise a list: drop unusable records and make sure every id is unique.
function normaliseList(list) {
  const seen = new Set();
  const out = [];
  let skipped = 0;
  list.forEach((raw, i) => {
    const p = normalisePlace(raw);
    if (!p) { skipped++; return; }
    let id = p.id || `p-${Date.now().toString(36)}-${i}`;
    while (seen.has(id)) id += '-' + i;
    seen.add(id); p.id = id;
    out.push(p);
  });
  return { places: out, skipped };
}

// Accepts any known saved/exported shape and returns { places, skipped }.
// Throws if the data isn't recognisable or is from a newer version of the app.
function migrate(data) {
  let version, list;
  if (Array.isArray(data)) { version = 2; list = data; }          // v2: bare array
  else if (data && typeof data === 'object' && Array.isArray(data.places)) {
    version = Number(data.version) || 2; list = data.places;
  } else {
    throw new Error('Not a London List file');
  }
  if (version > SCHEMA_VERSION) {
    throw new Error('Saved by a newer version of London List');
  }
  // Future migrations go here, e.g. if (version < 4) list = list.map(addCoords);
  return normaliseList(list);
}

function seedPlaces() {
  return SEED.map((s, i) => ({
    id: 'seed-' + i, area: s.area, name: s.name, note: s.note || null,
    tags: s.tags || [], visited: s.visited || false,
  }));
}

function loadPlaces() {
  let raw = storageGet(STORE_KEY);
  let fromLegacy = false;
  if (raw === null) {
    for (const key of LEGACY_KEYS) {
      raw = storageGet(key);
      if (raw !== null) { fromLegacy = true; break; }
    }
  }
  if (raw === null) {
    const seeded = seedPlaces();
    savePlaces(seeded);
    return seeded;
  }
  try {
    const { places: loaded } = migrate(JSON.parse(raw));
    if (fromLegacy) savePlaces(loaded); // write the v3 copy; the legacy key stays as-is
    return loaded;
  } catch (e) {
    // Keep the unreadable data aside (without replacing an earlier copy) and block saving.
    if (storageGet(DAMAGED_KEY) === null) storageSet(DAMAGED_KEY, raw);
    storageProblem = { message: e instanceof SyntaxError ? 'Your saved places couldn’t be read.' : e.message, raw };
    return [];
  }
}

function savePlaces(p) {
  if (storageProblem) {
    showToast('Not saved — sort out the storage problem first');
    return false;
  }
  const ok = storageSet(STORE_KEY, JSON.stringify({
    version: SCHEMA_VERSION, savedAt: new Date().toISOString(), places: p,
  }));
  if (!ok) showToast('Couldn’t save — storage is full or blocked. Export a backup.');
  return ok;
}

let places = loadPlaces();
let activeArea = 'all';
let activeType = 'all';

function allAreas() {
  const known = new Set(AREA_ORDER);
  const extra = [...new Set(places.map(p => p.area))].filter(a => !known.has(a));
  return [...AREA_ORDER.filter(a => places.some(p => p.area === a)), ...extra];
}

// ── MAP PANEL ─────────────────────────────────────────────────────────────────
let leafletMap = null;
let leafletMarkers = [];

function openMapPanel() {
  const visible = places.filter(p => {
    if (p.visited) return false;
    if (activeArea !== 'all' && p.area !== activeArea) return false;
    if (activeType !== 'all' && activeType !== 'visited') {
      if (!(p.tags||[]).includes(activeType)) return false;
    }
    return true;
  });

  if (!visible.length) { showToast('No places to show'); return; }

  const title = activeArea !== 'all' ? activeArea : `${visible.length} places`;
  document.getElementById('map-panel-title').textContent = title;
  document.getElementById('map-panel').classList.add('open');
  document.body.style.overflow = 'hidden';

  // Load Leaflet if not already loaded
  if (!window.L) {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    script.onload = () => initMap(visible);
    script.onerror = () => showToast('Map failed to load — check connection');
    document.head.appendChild(script);
  } else {
    initMap(visible);
  }
}

function closeMapPanel() {
  if (leafletMap) { leafletMap.stopLocate(); }
  window._locationMarker = null;
  window._locationAccuracy = null;
  document.getElementById('map-panel').classList.remove('open');
  document.body.style.overflow = '';
}

const tagDot = {
  food:'#b86e00', museum:'#2a5cc7', architecture:'#5a4a78',
  walk:'#2a6e40', history:'#b03020', art:'#6a1a90', nature:'#2a6e40'
};

function jitter() { return (Math.random() - 0.5) * 0.006; }

function initMap(visible) {
  if (!leafletMap) {
    leafletMap = L.map('the-map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(leafletMap);
  } else {
    leafletMarkers.forEach(m => leafletMap.removeLayer(m));
    leafletMarkers = [];
  }

  const bounds = [];

  visible.forEach(p => {
    const base = AREA_COORDS[p.area] || [51.505, -0.11];
    const lat = base[0] + jitter();
    const lon = base[1] + jitter();
    const tag = (p.tags||[])[0] || 'history';
    const color = tagDot[tag] || '#8b6f47';
    const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + ' London')}`;

    const icon = L.divIcon({
      className: '',
      html: `<div style="width:18px;height:18px;border-radius:50%;background:${color};border:2.5px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4)"></div>`,
      iconSize: [18,18], iconAnchor: [9,9]
    });

    const m = L.marker([lat, lon], { icon }).addTo(leafletMap);
    m.bindPopup(`<div style="font-family:-apple-system,sans-serif">
      <div style="font-weight:600;font-size:0.85rem;color:#1a1410;margin-bottom:3px">${esc(p.name)}</div>
      ${p.note ? `<div style="font-size:0.73rem;color:#8b6f47;font-style:italic;margin-bottom:5px">${esc(p.note)}</div>` : ''}
      <a href="${esc(mapsUrl)}" target="_blank" rel="noopener" style="color:#c0392b;font-size:0.78rem;font-weight:600;text-decoration:none">Open in Google Maps →</a>
    </div>`);
    leafletMarkers.push(m);
    bounds.push([lat, lon]);
  });

  if (bounds.length) {
    leafletMap.fitBounds(bounds, { padding: [30, 30] });
  }

  // Show live location as pulsing blue dot
  if (navigator.geolocation) {
    leafletMap.locate({ watch: true, enableHighAccuracy: true });
    leafletMap.on('locationfound', function(e) {
      if (window._locationMarker) {
        window._locationMarker.setLatLng(e.latlng);
        window._locationAccuracy.setLatLng(e.latlng).setRadius(e.accuracy);
      } else {
        window._locationAccuracy = L.circle(e.latlng, {
          radius: e.accuracy,
          color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 0.1, weight: 1
        }).addTo(leafletMap);
        const locIcon = L.divIcon({
          className: '',
          html: `<div style="width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid white;box-shadow:0 2px 8px rgba(26,115,232,0.6);animation:pulse 2s infinite"></div>
                 <style>@keyframes pulse{0%,100%{box-shadow:0 2px 8px rgba(26,115,232,0.6)}50%{box-shadow:0 2px 16px rgba(26,115,232,0.9)}}</style>`,
          iconSize: [16,16], iconAnchor: [8,8]
        });
        window._locationMarker = L.marker(e.latlng, { icon: locIcon, zIndexOffset: 1000 }).addTo(leafletMap);
      }
    });
  }

  setTimeout(() => leafletMap.invalidateSize(), 150);
}

// ── AREA PICKER ───────────────────────────────────────────────────────────────
function buildAreaPicker() {
  const picker = document.getElementById('area-picker');
  picker.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'area-pill all-pill' + (activeArea === 'all' ? ' active' : '');
  all.textContent = 'All areas';
  all.onclick = () => setArea('all', all);
  picker.appendChild(all);
  allAreas().forEach(area => {
    const btn = document.createElement('button');
    btn.className = 'area-pill' + (activeArea === area ? ' active' : '');
    btn.textContent = area; btn.dataset.area = area;
    btn.onclick = () => setArea(area, btn);
    picker.appendChild(btn);
  });
}

function setArea(area, btn) {
  if (activeArea === area && area !== 'all') {
    activeArea = 'all';
  } else {
    activeArea = area;
  }
  buildAreaPicker();
  setTimeout(() => {
    const active = document.querySelector('.area-pill.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }, 50);
  render();
}

function setType(type, btn) {
  if (activeType === type && type !== 'all') {
    // Tapping active filter — reset to all
    activeType = 'all';
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.type-btn').classList.add('active'); // first button = All
  } else {
    activeType = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  render();
}
function itemVisible(p) {
  if (activeType === 'visited') return p.visited;
  if (p.visited) return false;
  if (activeType !== 'all' && !(p.tags||[]).includes(activeType)) return false;
  return true;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  renderStorageBanner();
  const container = document.getElementById('list-container');
  container.innerHTML = '';

  const active = places.filter(p => !p.visited);
  const visited = places.filter(p => p.visited);
  document.getElementById('stats-inline').textContent = `${active.length} to go · ${visited.length} visited`;

  const areas = activeArea === 'all' ? allAreas() : [activeArea];

  if (activeArea !== 'all') {
    const count = places.filter(p => p.area === activeArea && itemVisible(p)).length;
    const bar = document.createElement('div');
    bar.className = 'context-bar';
    bar.innerHTML = `<span class="context-area">${esc(activeArea)}</span><span class="context-count">${count} place${count !== 1 ? 's' : ''}</span>`;
    container.appendChild(bar);
  }

  let anyItems = false;
  areas.forEach(area => {
    const areaPlaces = places.filter(p => p.area === area && itemVisible(p));
    if (!areaPlaces.length) return;
    anyItems = true;
    const sec = document.createElement('div');
    sec.className = 'area-section';
    if (activeArea === 'all') {
      const hdr = document.createElement('div');
      hdr.className = 'area-header';
      hdr.innerHTML = `<span class="area-name">${esc(area)}</span><span class="area-count">${areaPlaces.length} to go</span>`;
      sec.appendChild(hdr);
    }
    const grid = document.createElement('div');
    grid.className = 'items-grid';
    areaPlaces.forEach(p => renderItem(grid, p));
    sec.appendChild(grid);
    container.appendChild(sec);
  });

  if (!anyItems && !storageProblem) {
    const msg = activeType === 'visited' ? 'No visited places yet' : 'Nothing here — tap + to add a place';
    container.innerHTML += `<div class="empty-state">${msg}</div>`;
  }
}

function renderItem(grid, p) {
  const el = document.createElement('div');
  el.className = `item${p.visited ? ' visited' : ''}`;
  const tagHtml = (p.tags||[]).slice(0,1).map(t =>
    `<span class="item-tag ${tagColors[t]||''}">${esc(t)}</span>`
  ).join('');
  el.innerHTML = `
    <div class="item-check">${p.visited ? '✓' : ''}</div>
    <div class="item-body">
      <div class="item-name">${esc(p.name)}</div>
      ${p.note ? `<div class="item-note">${esc(p.note)}</div>` : ''}
    </div>
    ${tagHtml}
  `;
  // Tap = toggle visited. Hold (600 ms, finger kept still) = edit, and the
  // click that follows the hold is swallowed so it doesn't also toggle visited.
  let pressTimer = null, startX = 0, startY = 0, longPressed = false;
  const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; };
  el.addEventListener('pointerdown', e => {
    longPressed = false;
    startX = e.clientX; startY = e.clientY;
    cancelPress();
    pressTimer = setTimeout(() => {
      pressTimer = null;
      longPressed = true;
      if (navigator.vibrate) navigator.vibrate(10);
      openEditModal(p.id);
    }, 600);
  });
  el.addEventListener('pointermove', e => {
    // Allow small finger wobble; a real drag (e.g. scrolling) cancels the hold.
    if (pressTimer && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) cancelPress();
  });
  el.addEventListener('pointerup', cancelPress);
  el.addEventListener('pointercancel', cancelPress);
  el.addEventListener('pointerleave', cancelPress);
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('click', e => {
    if (longPressed) { longPressed = false; e.preventDefault(); return; }
    toggleVisited(p.id);
  });
  grid.appendChild(el);
}

function toggleVisited(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  p.visited = !p.visited;
  savePlaces(places);
  render();
  // The place disappears from the current list, so offer a real Undo.
  showToast(p.visited ? `“${p.name}” marked visited` : `“${p.name}” back on your list`, {
    label: 'Undo',
    onAction: () => { p.visited = !p.visited; savePlaces(places); render(); },
  });
}

// showToast(msg) or showToast(msg, { label: 'Undo', onAction: fn })
function showToast(msg, action) {
  const t = document.getElementById('toast');
  t.textContent = '';
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  t.classList.toggle('has-action', !!action);
  if (action) {
    const b = document.createElement('button');
    b.className = 'toast-action';
    b.textContent = action.label;
    b.onclick = () => { hideToast(); action.onAction(); };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 5000 : 2500);
}
function hideToast() {
  const t = document.getElementById('toast');
  t.classList.remove('show', 'has-action');
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal() {
  ['f-name','f-note'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-area-status').textContent = '';
  document.getElementById('modal-backdrop').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 250);
}
function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }
function backdropClick(e) { if (e.target === document.getElementById('modal-backdrop')) closeModal(); }

async function geocodeToArea(name) {
  const status = document.getElementById('f-area-status');
  status.textContent = 'Finding location…';
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(name + ', London')}&format=json&limit=1&countrycodes=gb`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();
    if (!data.length) { status.textContent = 'Not found — saving to To Sort'; return 'To Sort'; }
    const lat = parseFloat(data[0].lat);
    const lon = parseFloat(data[0].lon);
    let best = 'To Sort', bestDist = Infinity;
    for (const [area, coords] of Object.entries(AREA_COORDS)) {
      if (area === 'Anywhere (Underground)') continue;
      const d = Math.hypot(lat - coords[0], lon - coords[1]);
      if (d < bestDist) { bestDist = d; best = area; }
    }
    status.textContent = `📍 ${best}`;
    return best;
  } catch(e) {
    status.textContent = 'Could not locate — saving to To Sort';
    return 'To Sort';
  }
}

async function savePlace() {
  const name = document.getElementById('f-name').value.trim();
  const note = document.getElementById('f-note').value.trim();
  const tag  = document.getElementById('f-tag').value;
  if (!name) { document.getElementById('f-name').focus(); return; }
  const btn = document.querySelector('.btn-save');
  btn.textContent = 'Locating…'; btn.disabled = true;
  const area = await geocodeToArea(name);
  btn.textContent = 'Save place'; btn.disabled = false;
  places.push({ id: Date.now().toString(), area, name, note: note || null, tags: [tag], visited: false });
  savePlaces(places); closeModal(); activeArea = area;
  buildAreaPicker(); render();
  setTimeout(() => {
    const pill = document.querySelector(`.area-pill[data-area="${CSS.escape(area)}"]`);
    if (pill) pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }, 120);
}


// ── EDIT MODAL ────────────────────────────────────────────────────────────────
let editingId = null;

function openEditModal(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  editingId = id;

  document.getElementById('e-name').value = p.name;
  document.getElementById('e-note').value = p.note || '';

  // Populate area select
  const sel = document.getElementById('e-area');
  sel.innerHTML = '';
  const areas = [...new Set([...AREA_ORDER, ...places.map(x => x.area)])];
  areas.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    if (a === p.area) opt.selected = true;
    sel.appendChild(opt);
  });
  // Add To Sort if not there
  if (!areas.includes('To Sort')) {
    const opt = document.createElement('option');
    opt.value = 'To Sort'; opt.textContent = 'To Sort';
    if (p.area === 'To Sort') opt.selected = true;
    sel.appendChild(opt);
  }

  // Set tag
  const tagSel = document.getElementById('e-tag');
  const currentTag = (p.tags||[])[0] || 'history';
  [...tagSel.options].forEach(o => { o.selected = o.value === currentTag; });

  document.getElementById('edit-modal-backdrop').classList.add('open');
}

function closeEditModal() {
  document.getElementById('edit-modal-backdrop').classList.remove('open');
  editingId = null;
}

function backdropClickEdit(e) {
  if (e.target === document.getElementById('edit-modal-backdrop')) closeEditModal();
}

function saveEdit() {
  const p = places.find(x => x.id === editingId);
  if (!p) return;
  p.name = document.getElementById('e-name').value.trim() || p.name;
  p.area = document.getElementById('e-area').value;
  p.tags = [document.getElementById('e-tag').value];
  p.note = document.getElementById('e-note').value.trim() || null;
  savePlaces(places);
  closeEditModal();
  activeArea = p.area;
  buildAreaPicker();
  render();
}

function deleteFromEdit() {
  if (!confirm('Delete this place?')) return;
  places = places.filter(x => x.id !== editingId);
  savePlaces(places);
  closeEditModal();
  buildAreaPicker();
  render();
}
// ── BACKUP: EXPORT / IMPORT ───────────────────────────────────────────────────
let pendingImport = null; // { places, skipped, fileName }

function placeKey(p) {
  const n = p.name.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  return n + '|' + p.area;
}

function formatDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) +
    ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function openBackupSheet() {
  const last = storageGet(LAST_EXPORT_KEY);
  document.getElementById('backup-meta').textContent =
    `${places.length} place${places.length !== 1 ? 's' : ''} · ` +
    (last ? `Last backup ${formatDate(last)}` : 'No backup saved from this device yet');
  refreshUndoImport();
  pendingImport = null;
  document.getElementById('import-review').hidden = true;
  document.getElementById('backup-backdrop').classList.add('open');
}
function closeBackupSheet() {
  pendingImport = null;
  document.getElementById('backup-backdrop').classList.remove('open');
}

function refreshUndoImport() {
  const btn = document.getElementById('undo-import-btn');
  let backup = null;
  try { backup = JSON.parse(storageGet(BACKUP_KEY)); } catch (e) {}
  btn.hidden = !(backup && Array.isArray(backup.places));
  if (!btn.hidden) {
    document.getElementById('undo-import-meta').textContent =
      `Go back to the ${backup.places.length} places you had on ${formatDate(backup.savedAt)}`;
  }
}

// Hand a file to the iOS share sheet (Save to Files, AirDrop…), or download it.
async function saveFile(text, fileName, type) {
  const file = new File([text], fileName, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: fileName });
      return true;
    } catch (e) {
      if (e.name === 'AbortError') return false; // user cancelled the share sheet
      // otherwise fall through to a plain download
    }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return true;
}

async function exportBackup() {
  const now = new Date();
  const payload = { app: 'london-list', version: SCHEMA_VERSION, exportedAt: now.toISOString(), places };
  const fileName = `london-list-backup-${now.toISOString().slice(0, 10)}.json`;
  const saved = await saveFile(JSON.stringify(payload, null, 2), fileName, 'application/json');
  if (saved) {
    storageSet(LAST_EXPORT_KEY, now.toISOString());
    showToast('Backup saved');
    openBackupSheet(); // refresh "last backup"
  }
}

async function readImportFile(input) {
  const file = input.files && input.files[0];
  input.value = ''; // so choosing the same file again still triggers a change
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { showToast('That file is too big to be a London List backup'); return; }
  let result;
  try {
    result = migrate(JSON.parse(await file.text()));
  } catch (e) {
    showToast(e instanceof SyntaxError ? 'That file isn’t valid JSON' : e.message);
    return;
  }
  if (!result.places.length) { showToast('No places found in that file'); return; }
  pendingImport = { ...result, fileName: file.name };
  const n = result.places.length;
  document.getElementById('import-summary').textContent =
    `“${file.name}” has ${n} place${n !== 1 ? 's' : ''}` +
    (result.skipped ? ` (${result.skipped} unreadable entr${result.skipped !== 1 ? 'ies' : 'y'} will be skipped)` : '') +
    '. What would you like to do?';
  const review = document.getElementById('import-review');
  review.hidden = false;
  review.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// True if it's safe to stop protecting unreadable data (it was set aside, or the user accepts losing it).
function okToLeaveDamagedData() {
  if (!storageProblem || storageGet(DAMAGED_KEY) !== null) return true;
  return confirm('The unreadable data couldn’t be set aside, so continuing will lose it. ' +
    'Tap Cancel and use “Download unreadable data” first if you might need it. Continue?');
}

function applyImport(mode) {
  if (!pendingImport) return;
  if (!okToLeaveDamagedData()) return;
  // Keep a copy of the current list so the import can be undone.
  const hadBackup = storageSet(BACKUP_KEY, JSON.stringify({ savedAt: new Date().toISOString(), places }));
  if (!hadBackup && places.length &&
      !confirm('Couldn’t keep a copy of your current list, so this import can’t be undone. Continue?')) return;

  const incoming = pendingImport.places;
  let message;
  if (mode === 'replace') {
    places = incoming;
    message = `Replaced with ${incoming.length} places`;
  } else {
    const byId = new Map(places.map((p, i) => [p.id, i]));
    const keys = new Set(places.map(placeKey));
    let added = 0, updated = 0, dupes = 0;
    incoming.forEach(p => {
      if (byId.has(p.id)) { places[byId.get(p.id)] = p; updated++; }
      else if (keys.has(placeKey(p))) { dupes++; }
      else { places.push(p); keys.add(placeKey(p)); added++; }
    });
    message = `Added ${added}` + (updated ? `, updated ${updated}` : '') + (dupes ? `, skipped ${dupes} already here` : '');
  }
  storageProblem = null;
  pendingImport = null;
  savePlaces(places);
  closeBackupSheet();
  activeArea = 'all';
  buildAreaPicker(); render();
  showToast(message, hadBackup ? { label: 'Undo', onAction: undoImport } : null);
}

function undoImport() {
  let restored;
  try { restored = migrate(JSON.parse(storageGet(BACKUP_KEY))).places; }
  catch (e) { showToast('No import to undo'); return; }
  places = restored;
  storageProblem = null;
  if (savePlaces(places)) { try { localStorage.removeItem(BACKUP_KEY); } catch (e) {} }
  closeBackupSheet();
  activeArea = 'all';
  buildAreaPicker(); render();
  showToast(`Back to your ${places.length} places`);
}

// ── STORAGE PROBLEM BANNER ────────────────────────────────────────────────────
function renderStorageBanner() {
  const el = document.getElementById('storage-banner');
  el.innerHTML = '';
  if (!storageProblem) return;
  const box = document.createElement('div');
  box.className = 'storage-banner';
  box.setAttribute('role', 'alert');
  const title = document.createElement('strong');
  title.textContent = storageProblem.message;
  const body = document.createElement('div');
  body.textContent = 'Nothing has been deleted, and saving is paused so it can’t be overwritten. ' +
    'Download the unreadable data to keep it, restore a backup, or start a fresh list.';
  const actions = document.createElement('div');
  actions.className = 'banner-actions';
  [['Download unreadable data', exportDamaged],
   ['Restore a backup', openBackupSheet],
   ['Start fresh', startFresh]].forEach(([label, fn]) => {
    const b = document.createElement('button');
    b.textContent = label; b.onclick = fn;
    actions.appendChild(b);
  });
  box.append(title, body, actions);
  el.appendChild(box);
}

function exportDamaged() {
  const raw = storageProblem ? storageProblem.raw : storageGet(DAMAGED_KEY);
  if (raw === null || raw === undefined) return;
  saveFile(raw, `london-list-unreadable-${new Date().toISOString().slice(0, 10)}.txt`, 'text/plain');
}

function startFresh() {
  if (!confirm('Start an empty list? The unreadable data won’t be used.')) return;
  if (!okToLeaveDamagedData()) return;
  storageProblem = null;
  places = [];
  savePlaces(places);
  buildAreaPicker(); render();
}

buildAreaPicker();
render();
</script>

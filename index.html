function storageGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
}

// Escape user-entered text before it goes into any HTML string.
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
}

function cleanText(v, max) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').trim().slice(0, max);
}

// Turn any stored or imported record into a well-formed place, or null if unusable.
function normalisePlace(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const name = cleanText(raw.name, MAX_NAME);
  if (!name) return null;
  const tags = Array.isArray(raw.tags)
    ? [...new Set(raw.tags.filter(t => typeof t === 'string' && t.trim()).map(t => t.trim().toLowerCase()))]
    : [];
  return {
    id: typeof raw.id === 'string' && raw.id ? raw.id.slice(0, 100) : '',
    area: cleanText(raw.area, 100) || 'To Sort',
    name,
    note: cleanText(raw.note, MAX_NOTE) || null,
    tags,
    visited: raw.visited === true,
    areaByUser: raw.areaByUser === true,
    ...cleanLocation(raw),
  };
}

function cleanLocation(raw) {
  const lat = Number(raw.lat), lon = Number(raw.lon);
  const ok = raw.lat !== null && raw.lat !== undefined && raw.lon !== null && raw.lon !== undefined &&
    Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
  return {
    lat: ok ? Math.round(lat * 1e6) / 1e6 : null,
    lon: ok ? Math.round(lon * 1e6) / 1e6 : null,
    address: ok ? (cleanText(raw.address, 200) || null) : null,
    locCheck: !ok && raw.locCheck === true,
    noFixedLocation: !ok && raw.noFixedLocation === true, // walks, statues across London, etc.
  };
}
function hasLocation(p) { return Number.isFinite(p.lat) && Number.isFinite(p.lon); }

function postcodeFromAddress(address) {
  const m = String(address || '').toUpperCase().match(/\b([A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2})\b/);
  return m ? m[1] : null;
}

// Put located places into the area their location belongs to — except places whose
// area you chose yourself, places "All over London", and areas you made up.
function refileAreas(list) {
  const moves = [];
  list.forEach(p => {
    if (!hasLocation(p) || p.areaByUser || p.area === ALL_OVER || !(p.area in AREA_REGION)) return;
    const to = areaFor(p.lat, p.lon, postcodeFromAddress(p.address));
    if (to !== p.area) { moves.push({ id: p.id, name: p.name, from: p.area, to }); p.area = to; }
  });
  return moves;
}
// Places that should be on the map but aren't yet.
function wantsLocation(p) { return !hasLocation(p) && !p.noFixedLocation && p.area !== ALL_OVER; }
function needsChoosing() { return places.filter(p => wantsLocation(p) && p.locCheck); }

// Normalise a list: drop unusable records and make sure every id is unique.
function normaliseList(list) {
  const seen = new Set();
  const out = [];
  let skipped = 0;
  list.forEach((raw, i) => {
    const p = normalisePlace(raw);
    if (!p) { skipped++; return; }
    let id = p.id || `p-${Date.now().toString(36)}-${i}`;
    while (seen.has(id)) id += '-' + i;
    seen.add(id); p.id = id;
    out.push(p);
  });
  return { places: out, skipped };
}

// Accepts any known saved/exported shape and returns { places, skipped }.
// Throws if the data isn't recognisable or is from a newer version of the app.
function migrate(data) {
  let version, list;
  if (Array.isArray(data)) { version = 2; list = data; }          // v2: bare array
  else if (data && typeof data === 'object' && Array.isArray(data.places)) {
    version = Number(data.version) || 2; list = data.places;
  } else {
    throw new Error('Not a London List file');
  }
  if (version > SCHEMA_VERSION) {
    throw new Error('Saved by a newer version of London List');
  }
  // v3 → v4: location fields are added as null by normalisePlace(); nothing else changes.
  if (version < 5) {
    // Renamed areas carry over. Brixton & Tooting was split: places with a location
    // are re-filed after loading; those without one are asked about.
    list = list.map(raw => {
      if (!raw || typeof raw !== 'object' || typeof raw.area !== 'string') return raw;
      const old = raw.area.trim();
      if (!(old in AREA_RENAMES)) return raw;
      const out = { ...raw, area: AREA_RENAMES[old] };
      const located = raw.lat !== null && raw.lat !== undefined && Number.isFinite(Number(raw.lat));
      if (old === 'Brixton & Tooting' && !located) out.locCheck = true;
      return out;
    });
  }
  // Future migrations go here, e.g. if (version < 6) list = list.map(...);
  return normaliseList(list);
}

function seedPlaces() {
  return normaliseList(SEED.map((s, i) => ({
    id: 'seed-' + i, area: s.area, name: s.name, note: s.note || null,
    tags: s.tags || [], visited: s.visited || false,
  }))).places;
}

function loadPlaces() {
  let raw = storageGet(STORE_KEY);
  let fromLegacy = false;
  if (raw === null) {
    for (const key of LEGACY_KEYS) {
      raw = storageGet(key);
      if (raw !== null) { fromLegacy = true; break; }
    }
  }
  if (raw === null) {
    const seeded = seedPlaces();
    savePlaces(seeded);
    return seeded;
  }
  try {
    const parsed = JSON.parse(raw);
    const { places: loaded } = migrate(parsed);
    const storedVersion = Array.isArray(parsed) ? 2 : Number(parsed.version) || 2;
    if (fromLegacy || storedVersion < SCHEMA_VERSION) {
      // Keep the pre-upgrade data once, then save in the current format.
      const keepKey = 'll-before-v' + SCHEMA_VERSION;
      if (!fromLegacy && storageGet(keepKey) === null) storageSet(keepKey, raw);
      if (storedVersion < 5) {
        // New area list: re-file places that have a location, and remember what moved.
        const moves = refileAreas(loaded);
        if (moves.length) storageSet(AREA_MOVES_KEY, JSON.stringify({ at: new Date().toISOString(), moves }));
      }
      savePlaces(loaded); // (a legacy key stays as-is)
    }
    return loaded;
  } catch (e) {
    // Keep the unreadable data aside (without replacing an earlier copy) and block saving.
    if (storageGet(DAMAGED_KEY) === null) storageSet(DAMAGED_KEY, raw);
    storageProblem = { message: e instanceof SyntaxError ? 'Your saved places couldn’t be read.' : e.message, raw };
    return [];
  }
}

function savePlaces(p) {
  if (storageProblem) {
    showToast('Not saved — sort out the storage problem first');
    return false;
  }
  const ok = storageSet(STORE_KEY, JSON.stringify({
    version: SCHEMA_VERSION, savedAt: new Date().toISOString(), places: p,
  }));
  if (!ok) showToast('Couldn’t save — storage is full or blocked. Export a backup.');
  return ok;
}

let places = loadPlaces();
let activeArea = 'all';
let activeRegion = 'all';
let activeType = 'all';

// Is this place inside the chosen region / area?
function inScope(p) {
  if (activeArea !== 'all') return p.area === activeArea;
  if (activeRegion !== 'all') return regionOf(p.area) === activeRegion;
  return true;
}
function focusArea(area) { activeArea = area; activeRegion = regionOf(area); }

function allAreas() {
  const known = new Set(AREA_ORDER);
  const extra = [...new Set(places.map(p => p.area))].filter(a => !known.has(a));
  return [...AREA_ORDER.filter(a => places.some(p => p.area === a)), ...extra];
}

// ── MAP PANEL ─────────────────────────────────────────────────────────────────
let leafletMap = null;
let leafletMarkers = [];
let locationMarker = null, locationAccuracy = null;
let mapVisible = [];

function filteredPlaces() {
  return places.filter(p => {
    if (p.visited) return false;
    if (!inScope(p)) return false;
    if (activeType !== 'all' && activeType !== 'visited' && !(p.tags||[]).includes(activeType)) return false;
    return true;
  });
}

function openMapPanel() {
  const visible = filteredPlaces();
  if (!visible.length) { showToast('No places to show'); return; }
  mapVisible = visible;
  document.getElementById('map-panel-title').textContent =
    activeArea !== 'all' ? activeArea : activeRegion !== 'all' ? activeRegion : 'All places';
  document.getElementById('map-panel').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderMapBar();

  if (!window.L) {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    script.onload = () => initMap();
    script.onerror = () => showToast('Map failed to load — check connection');
    document.head.appendChild(script);
  } else {
    initMap();
  }
}

function closeMapPanel() {
  setFollowing(false);
  window.removeEventListener('deviceorientation', onHeading);
  if (leafletMap) {
    leafletMap.stopLocate();
    if (locationMarker) leafletMap.removeLayer(locationMarker);
    if (locationAccuracy) leafletMap.removeLayer(locationAccuracy);
  }
  locationMarker = locationAccuracy = null;
  lastLocation = null; centreOnNextFix = false;
  document.getElementById('map-panel').classList.remove('open');
  document.body.style.overflow = '';
}

const tagDot = {
  food:'#b86e00', museum:'#2a5cc7', architecture:'#5a4a78',
  walk:'#2a6e40', history:'#b03020', art:'#6a1a90', nature:'#2a6e40'
};

function mapLinks(p) {
  const ll = `${p.lat},${p.lon}`;
  return {
    apple: `https://maps.apple.com/?ll=${ll}&q=${encodeURIComponent(p.name)}`,
    google: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ll)}`,
  };
}

// ── WHERE AM I (locate button, follow mode, compass) ─────────────────────────
let lastLocation = null;      // most recent position (Leaflet LatLng)
let following = false;        // keep the map centred on you until you drag it
let centreOnNextFix = false;  // button tapped before the first position arrived
let heading = null;           // degrees from north, from the phone's compass

function setFollowing(on) {
  following = on;
  document.getElementById('locate-btn').classList.toggle('following', on);
}

function onLocationFound(e) {
  lastLocation = e.latlng;
  if (locationMarker) {
    locationMarker.setLatLng(e.latlng);
    locationAccuracy.setLatLng(e.latlng).setRadius(e.accuracy);
  } else {
    locationAccuracy = L.circle(e.latlng, {
      radius: e.accuracy, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 0.1, weight: 1, interactive: false
    }).addTo(leafletMap);
    const locIcon = L.divIcon({
      className: '',
      html: '<div class="loc-wrap"><div class="loc-heading"></div><div class="loc-dot"></div></div>',
      iconSize: [16,16], iconAnchor: [8,8]
    });
    locationMarker = L.marker(e.latlng, { icon: locIcon, zIndexOffset: 1000, interactive: false }).addTo(leafletMap);
    drawHeading();
  }
  if (centreOnNextFix) {
    centreOnNextFix = false;
    leafletMap.setView(e.latlng, Math.max(leafletMap.getZoom() || 0, 16));
    setFollowing(true);
  } else if (following) {
    leafletMap.panTo(e.latlng);
  }
}

function onLocationError(e) {
  if (!centreOnNextFix) return; // only complain when you asked for it
  centreOnNextFix = false;
  showToast(e.code === 1
    ? 'Location is off for this site. Allow it in Settings → Privacy → Location Services → Safari Websites.'
    : 'Couldn’t find where you are. Try again in a moment.');
}

function locateMe() {
  if (!leafletMap || !navigator.geolocation) { showToast('Location isn’t available on this device.'); return; }
  startCompass(); // needs this tap on iPhone
  if (following) { setFollowing(false); return; } // second tap stops following
  if (lastLocation) {
    leafletMap.setView(lastLocation, Math.max(leafletMap.getZoom(), 16));
    setFollowing(true);
  } else {
    centreOnNextFix = true;
    showToast('Finding where you are…');
    leafletMap.locate({ watch: true, enableHighAccuracy: true });
  }
}

// Compass: iPhone asks for permission (only from a tap); others just send events.
function startCompass() {
  if (!('DeviceOrientationEvent' in window) || startCompass.started) return;
  const listen = () => { startCompass.started = true; window.addEventListener('deviceorientation', onHeading); };
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') listen(); }).catch(() => {});
  } else {
    listen();
  }
}
function onHeading(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;   // iPhone
  else if (e.absolute && typeof e.alpha === 'number') h = (360 - e.alpha) % 360;
  if (h === null) return;
  heading = h;
  drawHeading();
}
function drawHeading() {
  const el = locationMarker && locationMarker.getElement() && locationMarker.getElement().querySelector('.loc-heading');
  if (!el) return;
  el.style.display = heading === null ? 'none' : 'block';
  if (heading !== null) el.style.transform = `rotate(${Math.round(heading)}deg)`;
}

function initMap() {
  if (!leafletMap) {
    leafletMap = L.map('the-map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(leafletMap);
    leafletMap.on('locationfound', onLocationFound); // registered once, not on every open
    leafletMap.on('locationerror', onLocationError);
    leafletMap.on('dragstart', () => setFollowing(false)); // moving the map yourself stops following
  }
  drawMarkers();
  if (navigator.geolocation) leafletMap.locate({ watch: true, enableHighAccuracy: true });
  setTimeout(() => leafletMap.invalidateSize(), 150);
}

function drawMarkers() {
  if (!leafletMap) return;
  leafletMarkers.forEach(m => leafletMap.removeLayer(m));
  leafletMarkers = [];
  const bounds = [];
  mapVisible.filter(hasLocation).forEach(p => {
    const tag = (p.tags||[])[0] || 'history';
    const color = tagDot[tag] || '#8b6f47';
    const links = mapLinks(p);
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:18px;height:18px;border-radius:50%;background:${color};border:2.5px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4)"></div>`,
      iconSize: [18,18], iconAnchor: [9,9]
    });
    const m = L.marker([p.lat, p.lon], { icon }).addTo(leafletMap);
    m.bindPopup(`<div style="font-family:-apple-system,sans-serif;min-width:170px">
      <div style="font-weight:600;font-size:0.9rem;color:#1a1410;margin-bottom:3px">${esc(p.name)}</div>
      ${p.address ? `<div style="font-size:0.75rem;color:#6e5636;margin-bottom:4px">${esc(p.address)}</div>` : ''}
      ${p.note ? `<div style="font-size:0.75rem;color:#6e5636;font-style:italic;margin-bottom:8px">${esc(p.note)}</div>` : ''}
      <div style="display:flex;gap:14px">
        <a href="${esc(links.apple)}" target="_blank" rel="noopener" style="color:#c0392b;font-size:0.85rem;font-weight:600;text-decoration:none;padding:6px 0">Apple Maps</a>
        <a href="${esc(links.google)}" target="_blank" rel="noopener" style="color:#c0392b;font-size:0.85rem;font-weight:600;text-decoration:none;padding:6px 0">Google Maps</a>
      </div>
    </div>`);
    leafletMarkers.push(m);
    bounds.push([p.lat, p.lon]);
  });
  if (bounds.length === 1) leafletMap.setView(bounds[0], 15);
  else if (bounds.length) leafletMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });
  else leafletMap.fitBounds([[LONDON_BBOX[1], LONDON_BBOX[0]], [LONDON_BBOX[3], LONDON_BBOX[2]]]);
}

// The strip under the map title: how many places are missing and a way to find them.
function renderMapBar() {
  const bar = document.getElementById('map-bar');
  bar.innerHTML = '';
  if (findingLocations) { bar.textContent = findingLocations; bar.hidden = false; return; }
  const located = mapVisible.filter(hasLocation).length;
  const missing = mapVisible.filter(wantsLocation);
  const toCheck = missing.filter(p => p.locCheck).length;
  const toFind = missing.length - toCheck;
  bar.hidden = !missing.length;
  if (!missing.length) return;
  const text = document.createElement('span');
  text.textContent = `${located} of ${located + missing.length} on the map.` +
    (toCheck ? ` ${toCheck} ${toCheck === 1 ? 'needs' : 'need'} you to choose.` : '');
  bar.appendChild(text);
  if (toCheck) {
    const b = document.createElement('button');
    b.className = 'map-bar-btn';
    b.textContent = `Choose ${toCheck}`;
    b.onclick = () => openReview();
    bar.appendChild(b);
  }
  if (toFind) {
    const b = document.createElement('button');
    b.className = 'map-bar-btn';
    b.textContent = `Find ${toFind} location${toFind !== 1 ? 's' : ''}`;
    b.onclick = findLocations;
    bar.appendChild(b);
  }
}

// ── FIND LOCATIONS FOR EXISTING PLACES ────────────────────────────────────────
// Looks each place up by name. A match is accepted only if its name matches and
// it lies in (or within 2.5 km of) the place's current area; otherwise the place
// is marked "Location?" so you can pick from the edit sheet.
let findingLocations = null; // progress text while running

const NAME_STOPWORDS = new Set(['the','a','an','at','of','and','in','on','for','to','london','s','st','cafe','café','restaurant','kitchen','house','museum','gallery','market','hotel','road','street','lane']);
function nameTokens(name) {
  return new Set(name.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/['’]s\b/g, '').replace(/[^a-z0-9]+/g, ' ').trim().split(' ')
    .filter(t => t.length > 1 && !NAME_STOPWORDS.has(t)));
}
function namesMatch(placeName, resultName) {
  const a = nameTokens(placeName), b = nameTokens(resultName);
  if (!a.size || !b.size) return placeName.trim().toLowerCase() === resultName.trim().toLowerCase();
  const shared = [...a].filter(t => b.has(t)).length;
  return shared >= 2 || (shared >= 1 && shared / a.size >= 0.5);
}
// The match must be in the place's area: its postcode district is listed for that
// area, or it is within 2 km of one of the area's centre points.
function areaAgrees(p, c) {
  if (!AREA_POINTS[p.area]) return true; // To Sort, Further afield, your own areas
  if (postcodeArea(c.postcode) === p.area) return true;
  return AREA_POINTS[p.area].some(([aLat, aLon]) => distanceKm(c.lat, c.lon, aLat, aLon) <= 2);
}

// Searches to try for a place, each with the name a result must match:
// "Morley Gallery — Canterbury Tales mural" → also "Morley Gallery";
// "Giacometti's at Tate Modern" → also "Tate Modern";
// note "Ethiopian — Blackstock Road, Finsbury Park" → also "JoJo's Kitchen Blackstock Road".
function searchTerms(name, note) {
  const terms = [{ q: name, match: name }];
  const main = name.split(/\s+[—–-]\s+/)[0].trim();
  if (main && main !== name) terms.push({ q: main, match: main });
  const at = main.split(/\s+at\s+/i);
  if (at.length === 2 && at[1].trim()) terms.push({ q: at[1].trim(), match: at[1].trim() });
  noteStreets(note).forEach(seg => terms.push({ q: `${main} ${seg}`, match: main }));
  const seen = new Set();
  return terms.filter(t => !seen.has(t.q.toLowerCase()) && seen.add(t.q.toLowerCase()));
}
// Bits of a note that look like a street or neighbourhood ("Blackstock Road", "Chapel Market").
function noteStreets(note) {
  if (!note) return [];
  return note.split(/\s*[—–·,;()]\s*|\s+-\s+/)
    .map(s => s.trim())
    .filter(s => s.length >= 4 && s.length <= 40 && /[a-z]{3}/i.test(s) && !/https?:|www\.|\.(com|co|uk|org)|@|£|\d{1,2}(am|pm)/i.test(s))
    .filter(s => /\b(road|rd|street|st|lane|place|square|sq|market|row|crescent|terrace|gardens|walk|hill|park|green|bridge|yard|court|gate|way|alley|circus|estate|station)\b/i.test(s))
    .slice(0, 2);
}

async function findLocations() {
  if (findingLocations) return;
  const targets = places.filter(p => wantsLocation(p) && !p.locCheck);
  if (!targets.length) return;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let found = 0, unsure = 0, skipped = 0, failuresInARow = 0, stopped = false;
  for (let i = 0; i < targets.length; i++) {
    const p = targets[i];
    findingLocations = `Finding locations… ${i + 1} of ${targets.length}`;
    renderMapBar();
    const terms = searchTerms(p.name, p.note);
    const accept = (list, term) => list.find(c => namesMatch(term.match, c.name) && areaAgrees(p, c));
    let match = null, anyAnswer = false;
    for (const term of terms) {
      try { match = accept(await searchPhoton(term.q, undefined, 4), term); anyAnswer = true; } catch (e) {}
      if (match) break;
      await sleep(300);
    }
    if (!match) {
      // Second opinion from Nominatim, which knows some names Photon doesn't (max 1 request a second).
      const term = terms[terms.length > 1 ? 1 : 0];
      await sleep(1100);
      try { match = accept(await searchNominatim(term.q), term); anyAnswer = true; } catch (e) {}
    }
    if (match) {
      p.lat = match.lat; p.lon = match.lon; p.address = match.address || null; p.locCheck = false;
      if (p.area === 'To Sort') p.area = areaFor(match.lat, match.lon, match.postcode);
      found++; failuresInARow = 0;
    } else if (anyAnswer) {
      p.locCheck = true; unsure++; failuresInARow = 0;
    } else {
      skipped++; // both services failed; left as-is so the next run tries again
      if (++failuresInARow >= 3) { stopped = true; break; }
    }
    if (i % 5 === 4) savePlaces(places); // keep progress if the app is closed midway
    await sleep(300);
  }
  findingLocations = null;
  savePlaces(places);
  buildAreaPicker(); render();
  mapVisible = filteredPlaces();
  renderMapBar(); drawMarkers();
  showToast((stopped ? 'Stopped — check your connection. ' : '') + `Found ${found}.` +
    (unsure ? ` ${unsure} ${unsure === 1 ? 'needs' : 'need'} you to choose — tap “Choose”.` : '') +
    (skipped && !stopped ? ` ${skipped} couldn’t be looked up; try again later.` : ''));
}

// ── AREA PICKER ───────────────────────────────────────────────────────────────
// The header row: All · Central · North · East · South · West (· Other).
// Choosing a part of London shows that part's areas in the same row.
function buildAreaPicker() {
  const picker = document.getElementById('area-picker');
  picker.innerHTML = '';
  const pill = (label, active, onclick, extraClass, count) => {
    const b = document.createElement('button');
    b.className = 'area-pill' + (extraClass ? ' ' + extraClass : '') + (active ? ' active' : '');
    b.textContent = label;
    if (count !== undefined) {
      const c = document.createElement('span');
      c.className = 'pill-count'; c.textContent = count;
      b.appendChild(c);
    }
    b.onclick = onclick;
    picker.appendChild(b);
    return b;
  };
  const shown = pred => places.filter(p => pred(p) && itemVisible(p)).length;
  if (activeRegion === 'all') {
    pill('All areas', true, () => setRegion('all'), 'all-pill');
    REGIONS.forEach(r => {
      const n = shown(p => regionOf(p.area) === r);
      if (r === 'Other' && !n) return;
      pill(r, false, () => setRegion(r), n ? '' : 'empty-pill', n);
    });
  } else {
    pill('‹ All', false, () => setRegion('all'), 'back-pill');
    pill(activeRegion, activeArea === 'all', () => setArea('all'), 'all-pill');
    allAreas().filter(a => regionOf(a) === activeRegion).forEach(a => {
      const b = pill(a, activeArea === a, () => setArea(a), '', shown(p => p.area === a));
      b.dataset.area = a;
    });
  }
}

function setRegion(region) {
  activeRegion = region;
  activeArea = 'all';
  buildAreaPicker();
  document.getElementById('area-picker').scrollLeft = 0;
  render();
}

function setArea(area) {
  if (area === 'all' || activeArea === area) activeArea = 'all'; // tap again to show the whole region
  else focusArea(area);
  buildAreaPicker();
  setTimeout(() => {
    const active = document.querySelector('.area-pill.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }, 50);
  render();
}

function setType(type, btn) {
  if (activeType === type && type !== 'all') {
    // Tapping active filter — reset to all
    activeType = 'all';
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.type-btn').classList.add('active'); // first button = All
  } else {
    activeType = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  buildAreaPicker(); // counts follow the category
  render();
}
function itemVisible(p) {
  if (activeType === 'visited') return p.visited;
  if (p.visited) return false;
  if (activeType !== 'all' && !(p.tags||[]).includes(activeType)) return false;
  return true;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  renderStorageBanner();
  const container = document.getElementById('list-container');
  container.innerHTML = '';

  const active = places.filter(p => !p.visited);
  const visited = places.filter(p => p.visited);
  document.getElementById('stats-inline').textContent = `${active.length} to go · ${visited.length} visited`;

  const areas = activeArea !== 'all' ? [activeArea]
    : allAreas().filter(a => activeRegion === 'all' || regionOf(a) === activeRegion);

  const toChoose = storageProblem ? 0 : needsChoosing().length;
  if (toChoose) {
    const nb = document.createElement('div');
    nb.className = 'needs-banner';
    const t = document.createElement('span');
    t.textContent = `${toChoose} place${toChoose !== 1 ? 's' : ''} need${toChoose === 1 ? 's' : ''} a location`;
    const b = document.createElement('button');
    b.textContent = 'Choose now';
    b.onclick = () => openReview();
    nb.append(t, b);
    container.appendChild(nb);
  }

  const moved = areaMoves();
  if (moved.length && !storageProblem) {
    const mb = document.createElement('div');
    mb.className = 'needs-banner';
    const t = document.createElement('span');
    t.textContent = `New areas: ${moved.length} place${moved.length !== 1 ? 's' : ''} moved`;
    const b = document.createElement('button');
    b.textContent = 'See changes';
    b.onclick = openMovesSheet;
    mb.append(t, b);
    container.appendChild(mb);
  }

  if (activeArea !== 'all' || activeRegion !== 'all') {
    const count = places.filter(p => inScope(p) && itemVisible(p)).length;
    const bar = document.createElement('div');
    bar.className = 'context-bar';
    bar.innerHTML = `<span class="context-area">${esc(activeArea !== 'all' ? activeArea : activeRegion)}</span><span class="context-count">${count} place${count !== 1 ? 's' : ''}</span>`;
    container.appendChild(bar);
  }

  let anyItems = false;
  areas.forEach(area => {
    const areaPlaces = places.filter(p => p.area === area && itemVisible(p));
    if (!areaPlaces.length) return;
    anyItems = true;
    const sec = document.createElement('div');
    sec.className = 'area-section';
    if (activeArea === 'all') {
      const hdr = document.createElement('div');
      hdr.className = 'area-header';
      hdr.innerHTML = `<span class="area-name">${esc(area)}</span><span class="area-count">${areaPlaces.length} to go</span>`;
      sec.appendChild(hdr);
    }
    const grid = document.createElement('div');
    grid.className = 'items-grid';
    areaPlaces.forEach(p => renderItem(grid, p));
    sec.appendChild(grid);
    container.appendChild(sec);
  });

  if (!anyItems && !storageProblem) {
    const msg = activeType === 'visited' ? 'No visited places yet' : 'Nothing here — tap + to add a place';
    container.innerHTML += `<div class="empty-state">${msg}</div>`;
  }
}

function renderItem(grid, p) {
  const el = document.createElement('div');
  el.className = `item${p.visited ? ' visited' : ''}`;
  const tagHtml = (p.tags||[]).slice(0,1).map(t =>
    `<span class="item-tag ${tagColors[t]||''}">${esc(t)}</span>`
  ).join('');
  el.innerHTML = `
    <div class="item-check">${p.visited ? '✓' : ''}</div>
    <div class="item-body">
      <div class="item-name">${esc(p.name)}${p.locCheck && wantsLocation(p) ? ' <button type="button" class="item-flag">Location?</button>' : ''}</div>
      ${p.note ? `<div class="item-note">${esc(p.note)}</div>` : ''}
    </div>
    ${tagHtml}
  `;
  const flag = el.querySelector('.item-flag');
  if (flag) {
    // Its own control: don't start the hold timer or toggle visited.
    flag.addEventListener('pointerdown', e => e.stopPropagation());
    flag.addEventListener('click', e => { e.stopPropagation(); openReview(p.id); });
  }
  // Tap = toggle visited. Hold (600 ms, finger kept still) = edit, and the
  // click that follows the hold is swallowed so it doesn't also toggle visited.
  let pressTimer = null, startX = 0, startY = 0, longPressed = false;
  const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; };
  el.addEventListener('pointerdown', e => {
    longPressed = false;
    startX = e.clientX; startY = e.clientY;
    cancelPress();
    pressTimer = setTimeout(() => {
      pressTimer = null;
      longPressed = true;
      if (navigator.vibrate) navigator.vibrate(10);
      openEditModal(p.id);
    }, 600);
  });
  el.addEventListener('pointermove', e => {
    // Allow small finger wobble; a real drag (e.g. scrolling) cancels the hold.
    if (pressTimer && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) cancelPress();
  });
  el.addEventListener('pointerup', cancelPress);
  el.addEventListener('pointercancel', cancelPress);
  el.addEventListener('pointerleave', cancelPress);
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('click', e => {
    if (longPressed) { longPressed = false; e.preventDefault(); return; }
    toggleVisited(p.id);
  });
  grid.appendChild(el);
}

function toggleVisited(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  p.visited = !p.visited;
  savePlaces(places);
  render();
  // The place disappears from the current list, so offer a real Undo.
  showToast(p.visited ? `“${p.name}” marked visited` : `“${p.name}” back on your list`, {
    label: 'Undo',
    onAction: () => { p.visited = !p.visited; savePlaces(places); render(); },
  });
}

// showToast(msg) or showToast(msg, { label: 'Undo', onAction: fn })
function showToast(msg, action) {
  const t = document.getElementById('toast');
  t.textContent = '';
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  t.classList.toggle('has-action', !!action);
  if (action) {
    const b = document.createElement('button');
    b.className = 'toast-action';
    b.textContent = action.label;
    b.onclick = () => { hideToast(); action.onAction(); };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 5000 : 2500);
}
function hideToast() {
  const t = document.getElementById('toast');
  t.classList.remove('show', 'has-action');
}

// ── LOCATIONS ─────────────────────────────────────────────────────────────────
// Lookups use free services that need no key: Photon (search as you type),
// Nominatim ("Search harder"), postcodes.io (postcodes and "I'm here now").
const LONDON_BBOX = [-0.51, 51.28, 0.33, 51.69]; // west, south, east, north


// Distance in km. (Degrees of longitude are much shorter than degrees of
// latitude at London's latitude; ignoring that put Tooting in Chelsea.)
function distanceKm(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(a));
}



// The area a postcode belongs to: undefined if unknown, null if it must be decided by distance.
function postcodeArea(postcode) {
  const pc = String(postcode || '').toUpperCase().replace(/\s+/g, '');
  const m = pc.match(/^([A-Z]{1,2}\d[A-Z\d]?)(\d)[A-Z]{2}$/);
  if (!m) return undefined;
  const [, district, sector] = m;
  const keys = [`${district} ${sector}`, district];
  if (/[A-Z]$/.test(district)) keys.push(district.slice(0, -1)); // SW1W → SW1, EC1V → EC1
  for (const key of keys) if (key in POSTCODE_AREAS) return POSTCODE_AREAS[key];
  return undefined;
}

function nearestArea(lat, lon) {
  let best = null, bestKm = Infinity;
  for (const [area, points] of Object.entries(AREA_POINTS)) {
    for (const [aLat, aLon] of points) {
      const km = distanceKm(lat, lon, aLat, aLon);
      if (km < bestKm) { bestKm = km; best = area; }
    }
  }
  return { area: best, km: bestKm };
}

// Work out the area for a location: postcode first, then nearest centre point;
// further than AREA_MAX_KM from every area → Further afield.
function areaFor(lat, lon, postcode) {
  const byPostcode = postcodeArea(postcode);
  if (byPostcode) return byPostcode;
  const { area, km } = nearestArea(lat, lon);
  return km <= AREA_MAX_KM ? area : FURTHER;
}

function inLondon(lat, lon) {
  return lon >= LONDON_BBOX[0] && lon <= LONDON_BBOX[2] && lat >= LONDON_BBOX[1] && lat <= LONDON_BBOX[3];
}

// Coordinates from a pasted Apple Maps or Google Maps link, if it contains them.
function coordsFromLink(text) {
  let t = String(text || '');
  try { t = decodeURIComponent(t); } catch (e) {}
  const patterns = [
    /!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,                                     // Google place data
    /[?&](?:ll|sll|q|query|center|daddr|destination)=(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/, // Apple/Google params
    /@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/,                                         // Google map view
  ];
  for (const re of patterns) {
    const m = t.match(re);
    if (m) {
      const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
      if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return { lat, lon };
    }
  }
  return null;
}

const POSTCODE_RE = /^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i;

// fetch JSON, giving up after 10 s. A cancel from the caller throws AbortError;
// a timeout throws a normal Error so callers treat it as a failed lookup.
async function fetchJson(url, signal, timeoutMs = 10000) {
  const ctrl = new AbortController();
  let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, timeoutMs);
  const onAbort = () => ctrl.abort();
  if (signal) { if (signal.aborted) ctrl.abort(); else signal.addEventListener('abort', onAbort); }
  try {
    const res = await fetch(url, { signal: ctrl.signal, headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    if (timedOut) throw new Error('Timed out');
    throw e;
  } finally {
    clearTimeout(timer);
    if (signal) signal.removeEventListener('abort', onAbort);
  }
}

function photonCandidate(f) {
  const p = f.properties || {};
  const [lon, lat] = f.geometry.coordinates;
  const street = [p.housenumber, p.street].filter(Boolean).join(' ');
  const name = p.name || street || p.district || p.city || 'Unnamed place';
  const parts = [street && street !== name ? street : null, p.district || p.locality || null, p.postcode || null];
  return { name, address: [...new Set(parts.filter(Boolean))].join(', '), lat, lon, postcode: p.postcode || null };
}

async function searchPhoton(text, signal, limit = 6) {
  const url = 'https://photon.komoot.io/api/?' + new URLSearchParams({
    q: text, limit: String(limit), lang: 'en', bbox: LONDON_BBOX.join(','),
    lat: '51.5074', lon: '-0.1278', // prefer central London when names are ambiguous
  });
  const data = await fetchJson(url, signal);
  return (data.features || []).map(photonCandidate).filter(c => inLondon(c.lat, c.lon));
}

async function searchNominatim(text, signal) {
  const [w, s, e, n] = LONDON_BBOX;
  const url = 'https://nominatim.openstreetmap.org/search?' + new URLSearchParams({
    q: text, format: 'jsonv2', limit: '6', addressdetails: '1', bounded: '1',
    viewbox: `${w},${n},${e},${s}`, 'accept-language': 'en',
  });
  const data = await fetchJson(url, signal);
  return data.map(r => {
    const a = r.address || {};
    const street = [a.house_number, a.road].filter(Boolean).join(' ');
    const name = r.name || street || r.display_name.split(',')[0];
    const parts = [street && street !== name ? street : null, a.suburb || a.neighbourhood || a.city_district || null, a.postcode || null];
    return { name, address: [...new Set(parts.filter(Boolean))].join(', '), lat: parseFloat(r.lat), lon: parseFloat(r.lon), postcode: a.postcode || null };
  });
}

async function lookupPostcode(pc, signal) {
  const data = await fetchJson('https://api.postcodes.io/postcodes/' + encodeURIComponent(pc.replace(/\s+/g, '')), signal);
  const r = data.result;
  return { name: 'Postcode ' + r.postcode, address: [r.admin_ward, r.admin_district].filter(Boolean).join(', '), lat: r.latitude, lon: r.longitude, postcode: r.postcode };
}

async function postcodeNear(lat, lon) {
  try {
    const data = await fetchJson(`https://api.postcodes.io/postcodes?lon=${lon}&lat=${lat}&limit=1&radius=300`);
    return data.result && data.result[0] ? data.result[0].postcode : null;
  } catch (e) { return null; }
}

function locationLabel(loc) {
  return loc.address || `${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}`;
}

// A search box with results, "I'm here now" and "Search harder", used in the
// add and edit sheets. opts.onChange(location|null) fires when a match is chosen or removed.
function createLocationPicker(root, opts) {
  root.innerHTML = `
    <div class="loc-chosen" hidden>
      <div class="loc-chosen-body"><div class="loc-chosen-name"></div><div class="loc-chosen-addr"></div></div>
      <button type="button" class="loc-link loc-change">Change</button>
    </div>
    <div class="loc-search">
      <input type="search" class="loc-q" placeholder="Name, address, postcode or Maps link" autocomplete="off" autocapitalize="words" enterkeyhint="search" aria-label="Search for the location">
      <div class="loc-actions">
        <button type="button" class="loc-chip loc-here">◎ I’m here now</button>
        <button type="button" class="loc-chip loc-harder">Search harder</button>
        <button type="button" class="loc-chip loc-remove" hidden>No location</button>
      </div>
      <div class="loc-status" aria-live="polite"></div>
      <div class="loc-results"></div>
    </div>`;
  const $ = sel => root.querySelector(sel);
  const q = $('.loc-q'), results = $('.loc-results'), status = $('.loc-status');
  const chosenBox = $('.loc-chosen'), searchBox = $('.loc-search');
  let chosen = null, reqId = 0, timer = null, ctrl = null, typed = false, previous = null;

  const setStatus = t => { status.textContent = t || ''; };

  function showChosen() {
    chosenBox.hidden = !chosen;
    searchBox.hidden = !!chosen;
    if (chosen) {
      $('.loc-chosen-name').textContent = '📍 ' + (chosen.name || 'Location');
      $('.loc-chosen-addr').textContent = locationLabel(chosen);
    }
  }

  function choose(loc) {
    chosen = loc ? { lat: loc.lat, lon: loc.lon, address: loc.address || null, postcode: loc.postcode || null, name: loc.name || '' } : null;
    results.innerHTML = ''; setStatus('');
    showChosen();
    opts.onChange(chosen);
  }

  function renderCandidates(list) {
    results.innerHTML = '';
    list.forEach(c => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'loc-result';
      const n = document.createElement('span'); n.className = 'loc-result-name'; n.textContent = c.name;
      const a = document.createElement('span'); a.className = 'loc-result-addr';
      a.textContent = [c.address, areaFor(c.lat, c.lon, c.postcode)].filter(Boolean).join(' · ');
      b.append(n, a);
      b.onclick = () => choose(c);
      results.appendChild(b);
    });
  }

  async function run(text, deep) {
    text = (text || '').trim();
    const id = ++reqId;
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    if (text.length < 3) { results.innerHTML = ''; setStatus(''); return; }

    if (/^https?:\/\//i.test(text) || /maps\.(apple|google)|goo\.gl|maps\.app/i.test(text)) {
      const c = coordsFromLink(text);
      if (c) {
        setStatus('Reading link…');
        const postcode = await postcodeNear(c.lat, c.lon);
        if (id !== reqId) return;
        renderCandidates([{ name: 'Location from link', address: postcode ? 'Near ' + postcode : '', ...c, postcode }]);
        setStatus('');
      } else {
        results.innerHTML = '';
        setStatus('That link doesn’t include a location. Search by name or postcode instead.');
      }
      return;
    }

    setStatus(deep ? 'Searching harder…' : 'Searching…');
    const found = [];
    try {
      if (POSTCODE_RE.test(text)) found.push(await lookupPostcode(text, ctrl.signal));
    } catch (e) { if (e.name === 'AbortError') return; }
    try {
      found.push(...await (deep ? searchNominatim(text, ctrl.signal) : searchPhoton(text, ctrl.signal)));
    } catch (e) {
      if (e.name === 'AbortError') return;
      if (id === reqId && !found.length) { results.innerHTML = ''; setStatus(deep ? 'Couldn’t search — check your connection.' : 'Search isn’t responding. Tap Search harder to try another service.'); return; }
    }
    if (id !== reqId) return;
    const seen = new Set();
    const unique = found.filter(c => {
      const k = c.name.toLowerCase() + '|' + c.lat.toFixed(4) + '|' + c.lon.toFixed(4);
      if (seen.has(k)) return false; seen.add(k); return true;
    });
    renderCandidates(unique);
    setStatus(unique.length ? 'Tap the right one:' :
      deep ? 'Still nothing in London. Try an address or postcode.' : 'No matches in London. Try Search harder, an address or a postcode.');
  }

  function schedule(text) {
    clearTimeout(timer);
    timer = setTimeout(() => run(text, false), 350);
  }

  // Search several phrasings and show all the matches together.
  async function runMany(queries, rank) {
    const id = ++reqId;
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    setStatus('Searching…');
    // Run the searches side by side; keep the order of the phrasings.
    const settled = await Promise.allSettled(queries.map(text => searchPhoton(text, ctrl.signal, 5)));
    if (id !== reqId) return;
    let found = settled.flatMap(r => r.status === 'fulfilled' ? r.value : []);
    if (settled.every(r => r.status === 'rejected')) {
      // Photon unavailable: ask Nominatim instead, a few phrasings at most, one a second.
      const tries = [...new Set([q.value, ...queries.slice().reverse()].filter(Boolean))].slice(0, 3);
      let reached = false;
      for (let i = 0; i < tries.length && !found.length; i++) {
        if (i) await new Promise(r => setTimeout(r, 1100));
        if (id !== reqId) return;
        try { found = await searchNominatim(tries[i], ctrl.signal); reached = true; }
        catch (e) { if (e.name === 'AbortError' || id !== reqId) return; }
      }
      if (id !== reqId) return;
      if (!reached) { results.innerHTML = ''; setStatus('Couldn’t search — check your connection.'); return; }
    }
    const seen = new Set();
    let unique = found.filter(c => {
      const k = c.name.toLowerCase() + '|' + c.lat.toFixed(3) + '|' + c.lon.toFixed(3);
      if (seen.has(k)) return false; seen.add(k); return true;
    });
    if (rank) unique = unique.map((c, i) => [rank(c), i, c]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(x => x[2]);
    unique = unique.slice(0, 8);
    renderCandidates(unique);
    setStatus(unique.length ? 'Tap the right one:' : 'No matches. Type a street, postcode, or try Search harder.');
  }

  q.addEventListener('input', () => { typed = true; schedule(q.value); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(timer); run(q.value, false); } });
  $('.loc-harder').onclick = () => { clearTimeout(timer); run(q.value || opts.getName(), true); };
  $('.loc-change').onclick = () => {
    previous = chosen;
    chosen = null; showChosen();
    $('.loc-remove').hidden = false;
    if (!q.value) q.value = opts.getName();
    run(q.value, false).then(() => { if (previous && !results.children.length) setStatus('Your current location is kept unless you pick a new one.'); });
    q.focus();
  };
  $('.loc-remove').onclick = () => { previous = null; choose(null); setStatus('Saved without a location.'); };
  $('.loc-here').onclick = () => {
    if (!navigator.geolocation) { setStatus('Location isn’t available on this device.'); return; }
    setStatus('Finding where you are…');
    navigator.geolocation.getCurrentPosition(async pos => {
      const { latitude: lat, longitude: lon, accuracy } = pos.coords;
      const postcode = await postcodeNear(lat, lon);
      choose({ name: 'Where I was standing', lat, lon, postcode,
        address: (postcode ? 'Near ' + postcode : '') + (accuracy > 100 ? ` (accurate to about ${Math.round(accuracy)} m)` : '') });
    }, err => {
      setStatus(err.code === 1 ? 'Location permission is off for this site. Allow it in Settings → Safari → Location.' : 'Couldn’t get your location. Try again outside or search instead.');
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  };

  return {
    // Fill the search from the place name, unless the user has typed their own search.
    followName(name) { if (!typed && !chosen) { q.value = name; schedule(name); } },
    reset(loc, name) {
      clearTimeout(timer); if (ctrl) ctrl.abort(); reqId++;
      typed = false; previous = null;
      results.innerHTML = ''; setStatus('');
      $('.loc-remove').hidden = true;
      q.value = '';
      chosen = loc && loc.lat !== null && loc.lat !== undefined ? { ...loc } : null;
      showChosen();
      if (!chosen && name) { q.value = name; run(name, false); }
    },
    // While changing, the old location is kept until a new one is picked or removed.
    get value() { return chosen || previous; },
    // Start with the search box showing `shown`, but search all of `queries`.
    searchFor(shown, queries, rank) {
      clearTimeout(timer); typed = false; previous = null; chosen = null; showChosen();
      $('.loc-remove').hidden = true;
      q.value = shown; results.innerHTML = '';
      runMany(queries, rank);
    },
  };
}

function fillAreaSelect(sel, current) {
  sel.innerHTML = '';
  sel.dataset.touched = '';
  const custom = [...new Set(places.map(x => x.area))].filter(a => !(a in AREA_REGION));
  if (current && !(current in AREA_REGION) && !custom.includes(current)) custom.push(current);
  AREA_GROUPS.forEach(g => {
    const group = document.createElement('optgroup');
    group.label = g.region;
    const names = g.areas.map(a => a[0]);
    if (g.region === 'Other') names.splice(names.length - 1, 0, ...custom); // your own areas before To Sort
    names.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a; opt.textContent = a;
      opt.selected = a === current;
      group.appendChild(opt);
    });
    sel.appendChild(group);
  });
}

// ── ADD MODAL ─────────────────────────────────────────────────────────────────
let addPicker = null, editPicker = null;

function nameStartsLike(typed, suggestion) {
  const a = typed.trim().toLowerCase(), b = suggestion.toLowerCase();
  return !a || (b.startsWith(a) && b !== a);
}

function updateAddSaveLabel() {
  document.querySelector('#modal-backdrop .btn-save').textContent =
    addPicker.value ? 'Save place' : 'Save without location';
}

function openModal() {
  ['f-name','f-note'].forEach(id => document.getElementById(id).value = '');
  fillAreaSelect(document.getElementById('f-area'), TO_SORT);
  addPicker.reset(null, '');
  updateAddSaveLabel();
  document.getElementById('modal-backdrop').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 250);
}
function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }
function backdropClick(e) { if (e.target === document.getElementById('modal-backdrop')) closeModal(); }

function savePlace() {
  const nameEl = document.getElementById('f-name');
  const name = cleanText(nameEl.value, MAX_NAME);
  const note = cleanText(document.getElementById('f-note').value, MAX_NOTE);
  const tag  = document.getElementById('f-tag').value;
  if (!name) { nameEl.focus(); showToast('Add a name first'); return; }
  const loc = addPicker.value;
  const area = document.getElementById('f-area').value || 'To Sort';
  const dupe = places.find(p => placeKey(p) === placeKey({ name, area }));
  if (dupe && !confirm(`“${dupe.name}” is already in ${area}. Add it again?`)) return;
  places.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    area, name, note: note || null, tags: [tag], visited: false,
    lat: loc ? loc.lat : null, lon: loc ? loc.lon : null,
    address: loc ? (loc.address || null) : null, locCheck: false,
    areaByUser: document.getElementById('f-area').dataset.touched === '1',
  });
  if (!savePlaces(places)) return;
  closeModal(); focusArea(area);
  buildAreaPicker(); render();
  showToast(loc ? `Saved to ${area}` : `Saved to ${area} without a location`);
  setTimeout(() => {
    const pill = document.querySelector(`.area-pill[data-area="${CSS.escape(area)}"]`);
    if (pill) pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }, 120);
}

// ── EDIT MODAL ────────────────────────────────────────────────────────────────
let editingId = null;

function openEditModal(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('e-name').value = p.name;
  document.getElementById('e-note').value = p.note || '';
  fillAreaSelect(document.getElementById('e-area'), p.area);
  const tagSel = document.getElementById('e-tag');
  const currentTag = (p.tags||[])[0] || 'history';
  [...tagSel.options].forEach(o => { o.selected = o.value === currentTag; });
  // With a location: show it. Without one: start searching for the name straight away.
  editPicker.reset(hasLocation(p) ? { lat: p.lat, lon: p.lon, address: p.address, name: p.name } : null,
                   hasLocation(p) || p.area === ALL_OVER ? '' : p.name);
  document.getElementById('edit-modal-backdrop').classList.add('open');
}

function closeEditModal() {
  document.getElementById('edit-modal-backdrop').classList.remove('open');
  editingId = null;
}

function backdropClickEdit(e) {
  if (e.target === document.getElementById('edit-modal-backdrop')) closeEditModal();
}

function saveEdit() {
  const p = places.find(x => x.id === editingId);
  if (!p) return;
  p.name = cleanText(document.getElementById('e-name').value, MAX_NAME) || p.name;
  const areaSel = document.getElementById('e-area');
  if (areaSel.value !== p.area || areaSel.dataset.touched === '1') {
    // You picked it yourself, unless it was filled in from a newly chosen location.
    p.areaByUser = areaSel.dataset.touched === '1';
  }
  p.area = areaSel.value;
  // Keep any extra categories; only the first (shown) one is edited here.
  const tags = (p.tags || []).slice();
  tags[0] = document.getElementById('e-tag').value;
  p.tags = [...new Set(tags)];
  p.note = cleanText(document.getElementById('e-note').value, MAX_NOTE) || null;
  const loc = editPicker.value;
  p.lat = loc ? loc.lat : null;
  p.lon = loc ? loc.lon : null;
  p.address = loc ? (loc.address || null) : null;
  if (loc) { p.locCheck = false; p.noFixedLocation = false; }
  savePlaces(places);
  closeEditModal();
  focusArea(p.area);
  buildAreaPicker();
  render();
}

function deleteFromEdit() {
  if (!confirm('Delete this place?')) return;
  places = places.filter(x => x.id !== editingId);
  savePlaces(places);
  closeEditModal();
  buildAreaPicker();
  render();
}

// ── AREA CHANGES REVIEW ───────────────────────────────────────────────────────
function areaMoves() {
  try {
    const data = JSON.parse(storageGet(AREA_MOVES_KEY));
    return data && Array.isArray(data.moves) ? data.moves.filter(m => places.some(p => p.id === m.id && p.area === m.to)) : [];
  } catch (e) { return []; }
}
function saveAreaMoves(moves) {
  if (moves.length) storageSet(AREA_MOVES_KEY, JSON.stringify({ at: new Date().toISOString(), moves }));
  else { try { localStorage.removeItem(AREA_MOVES_KEY); } catch (e) {} }
}

function openMovesSheet() {
  const list = document.getElementById('moves-list');
  list.innerHTML = '';
  const moves = areaMoves();
  if (!moves.length) { closeMovesSheet(); return; }
  moves.forEach(m => {
    const row = document.createElement('div');
    row.className = 'move-row';
    const body = document.createElement('div');
    body.className = 'move-body';
    const n = document.createElement('div'); n.className = 'move-name'; n.textContent = m.name;
    const w = document.createElement('div'); w.className = 'move-where'; w.textContent = `${m.from} → ${m.to}`;
    body.append(n, w);
    const b = document.createElement('button');
    b.className = 'move-undo'; b.textContent = 'Put back';
    b.onclick = () => {
      const p = places.find(x => x.id === m.id);
      if (p) { p.area = m.from; p.areaByUser = true; savePlaces(places); }
      saveAreaMoves(areaMoves().filter(x => x.id !== m.id));
      buildAreaPicker(); render(); openMovesSheet();
    };
    row.append(body, b);
    list.appendChild(row);
  });
  document.getElementById('moves-summary').textContent =
    `The area list now has more areas, grouped by part of London. ${moves.length === 1 ? 'This place was' : `These ${moves.length} places were`} moved to match where ${moves.length === 1 ? 'it is' : 'they are'}. Put back any you'd rather keep where they were.`;
  document.getElementById('moves-backdrop').classList.add('open');
}
function closeMovesSheet() { document.getElementById('moves-backdrop').classList.remove('open'); }
function keepAllMoves() { saveAreaMoves([]); closeMovesSheet(); buildAreaPicker(); render(); }

// ── CHOOSE LOCATIONS (one place at a time) ────────────────────────────────────
let reviewQueue = [], reviewIndex = 0, reviewPicker = null;

function openReview(startId) {
  // The tapped place first, then the rest of those still to choose.
  reviewQueue = needsChoosing().map(p => p.id).filter(id => id !== startId);
  if (startId) reviewQueue.unshift(startId);
  if (!reviewQueue.length) { showToast('Nothing left to choose'); return; }
  reviewIndex = 0;
  document.getElementById('review-backdrop').classList.add('open');
  showReviewItem();
}

function showReviewItem() {
  while (reviewIndex < reviewQueue.length) {
    const p = places.find(x => x.id === reviewQueue[reviewIndex]);
    if (p && wantsLocation(p)) break;
    reviewIndex++;
  }
  if (reviewIndex >= reviewQueue.length) { closeReview(); showToast('All done'); return; }
  const p = places.find(x => x.id === reviewQueue[reviewIndex]);
  document.getElementById('review-progress').textContent = `Choose location · ${reviewIndex + 1} of ${reviewQueue.length}`;
  document.getElementById('review-name').textContent = p.name;
  document.getElementById('review-meta').textContent = [p.area, (p.tags || [])[0]].filter(Boolean).join(' · ');
  document.getElementById('review-note').textContent = p.note || '';
  // Search the name, its main part, name + street from the note, and the bare street
  // (statues and friezes often only exist on the map as the street they're on).
  const terms = searchTerms(p.name, p.note).map(t => t.q);
  // Matches in the place's own area come first.
  reviewPicker.searchFor(terms.length > 1 ? terms[1] : terms[0], [...terms, ...noteStreets(p.note)],
    c => areaAgrees(p, c) ? 0 : 1);
  document.querySelector('#review-backdrop .modal').scrollTop = 0;
}

function reviewCurrent() { return places.find(x => x.id === reviewQueue[reviewIndex]); }

function reviewPicked(loc) {
  const p = reviewCurrent();
  if (!p || !loc) return;
  const before = { lat: p.lat, lon: p.lon, address: p.address, area: p.area, locCheck: p.locCheck, noFixedLocation: p.noFixedLocation };
  const index = reviewIndex;
  p.lat = loc.lat; p.lon = loc.lon; p.address = loc.address || null;
  p.locCheck = false; p.noFixedLocation = false;
  const area = areaFor(loc.lat, loc.lon, loc.postcode);
  p.area = area; p.areaByUser = false;
  savePlaces(places);
  buildAreaPicker(); render();
  showToast(`${p.name}: ${p.area}`, { label: 'Undo', onAction: () => {
    Object.assign(p, before); savePlaces(places); buildAreaPicker(); render();
    if (document.getElementById('review-backdrop').classList.contains('open')) { reviewIndex = index; showReviewItem(); }
  }});
  reviewIndex++;
  showReviewItem();
}

function reviewNoFixed() {
  const p = reviewCurrent();
  if (p) { p.noFixedLocation = true; p.locCheck = false; savePlaces(places); render(); }
  reviewIndex++;
  showReviewItem();
}
function reviewSkip() { reviewIndex++; showReviewItem(); }

function closeReview() {
  document.getElementById('review-backdrop').classList.remove('open');
  buildAreaPicker(); render();
  if (document.getElementById('map-panel').classList.contains('open')) {
    mapVisible = filteredPlaces(); renderMapBar(); drawMarkers();
  }
}

function setupPickers() {
  reviewPicker = createLocationPicker(document.getElementById('r-loc'), {
    getName: () => (reviewCurrent() || {}).name || '',
    onChange: loc => { if (loc) reviewPicked(loc); },
  });
  addPicker = createLocationPicker(document.getElementById('f-loc'), {
    getName: () => document.getElementById('f-name').value,
    onChange: loc => {
      if (loc) {
        const sel = document.getElementById('f-area');
        sel.value = areaFor(loc.lat, loc.lon, loc.postcode);
        sel.dataset.touched = '';
        const nameEl = document.getElementById('f-name');
        if (loc.name && !/^(Postcode |Location from link|Where I was standing)/.test(loc.name) && nameStartsLike(nameEl.value, loc.name)) {
          nameEl.value = loc.name;
        }
      }
      updateAddSaveLabel();
    },
  });
  document.getElementById('f-name').addEventListener('input', e => addPicker.followName(e.target.value));
  ['f-area', 'e-area'].forEach(id => document.getElementById(id).addEventListener('change', e => { e.target.dataset.touched = '1'; }));
  editPicker = createLocationPicker(document.getElementById('e-loc'), {
    getName: () => document.getElementById('e-name').value,
    onChange: loc => {
      if (loc) {
        const sel = document.getElementById('e-area');
        const area = areaFor(loc.lat, loc.lon, loc.postcode);
        if (![...sel.options].some(o => o.value === area)) fillAreaSelect(sel, area);
        sel.value = area;
        sel.dataset.touched = '';
      }
    },
  });
}

// ── BACKUP: EXPORT / IMPORT ───────────────────────────────────────────────────
let pendingImport = null; // { places, skipped, fileName }

function placeKey(p) {
  const n = p.name.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  return n + '|' + p.area;
}

function formatDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) +
    ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function openBackupSheet() {
  const last = storageGet(LAST_EXPORT_KEY);
  document.getElementById('backup-meta').textContent =
    `${places.length} place${places.length !== 1 ? 's' : ''} · ` +
    (last ? `Last backup ${formatDate(last)}` : 'No backup saved from this device yet');
  refreshUndoImport();
  pendingImport = null;
  document.getElementById('import-review').hidden = true;
  document.getElementById('backup-backdrop').classList.add('open');
}
function closeBackupSheet() {
  pendingImport = null;
  document.getElementById('backup-backdrop').classList.remove('open');
}

function refreshUndoImport() {
  const btn = document.getElementById('undo-import-btn');
  let backup = null;
  try { backup = JSON.parse(storageGet(BACKUP_KEY)); } catch (e) {}
  btn.hidden = !(backup && Array.isArray(backup.places));
  if (!btn.hidden) {
    document.getElementById('undo-import-meta').textContent =
      `Go back to the ${backup.places.length} places you had on ${formatDate(backup.savedAt)}`;
  }
}

// Hand a file to the iOS share sheet (Save to Files, AirDrop…), or download it.
async function saveFile(text, fileName, type) {
  const file = new File([text], fileName, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: fileName });
      return true;
    } catch (e) {
      if (e.name === 'AbortError') return false; // user cancelled the share sheet
      // otherwise fall through to a plain download
    }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return true;
}

async function exportBackup() {
  const now = new Date();
  const payload = { app: 'london-list', version: SCHEMA_VERSION, exportedAt: now.toISOString(), places };
  const fileName = `london-list-backup-${now.toISOString().slice(0, 10)}.json`;
  const saved = await saveFile(JSON.stringify(payload, null, 2), fileName, 'application/json');
  if (saved) {
    storageSet(LAST_EXPORT_KEY, now.toISOString());
    showToast('Backup saved');
    openBackupSheet(); // refresh "last backup"
  }
}

async function readImportFile(input) {
  const file = input.files && input.files[0];
  input.value = ''; // so choosing the same file again still triggers a change
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { showToast('That file is too big to be a London List backup'); return; }
  let result;
  try {
    result = migrate(JSON.parse(await file.text()));
  } catch (e) {
    showToast(e instanceof SyntaxError ? 'That file isn’t valid JSON' : e.message);
    return;
  }
  if (!result.places.length) { showToast('No places found in that file'); return; }
  pendingImport = { ...result, fileName: file.name };
  const n = result.places.length;
  document.getElementById('import-summary').textContent =
    `“${file.name}” has ${n} place${n !== 1 ? 's' : ''}` +
    (result.skipped ? ` (${result.skipped} unreadable entr${result.skipped !== 1 ? 'ies' : 'y'} will be skipped)` : '') +
    '. What would you like to do?';
  const review = document.getElementById('import-review');
  review.hidden = false;
  review.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// True if it's safe to stop protecting unreadable data (it was set aside, or the user accepts losing it).
function okToLeaveDamagedData() {
  if (!storageProblem || storageGet(DAMAGED_KEY) !== null) return true;
  return confirm('The unreadable data couldn’t be set aside, so continuing will lose it. ' +
    'Tap Cancel and use “Download unreadable data” first if you might need it. Continue?');
}

function applyImport(mode) {
  if (!pendingImport) return;
  if (!okToLeaveDamagedData()) return;
  // Keep a copy of the current list so the import can be undone.
  const hadBackup = storageSet(BACKUP_KEY, JSON.stringify({ savedAt: new Date().toISOString(), places }));
  if (!hadBackup && places.length &&
      !confirm('Couldn’t keep a copy of your current list, so this import can’t be undone. Continue?')) return;

  const incoming = pendingImport.places;
  let message;
  if (mode === 'replace') {
    places = incoming;
    message = `Replaced with ${incoming.length} places`;
  } else {
    const byId = new Map(places.map((p, i) => [p.id, i]));
    const keys = new Set(places.map(placeKey));
    let added = 0, updated = 0, dupes = 0;
    incoming.forEach(p => {
      if (byId.has(p.id)) { places[byId.get(p.id)] = p; updated++; }
      else if (keys.has(placeKey(p))) { dupes++; }
      else { places.push(p); keys.add(placeKey(p)); added++; }
    });
    message = `Added ${added}` + (updated ? `, updated ${updated}` : '') + (dupes ? `, skipped ${dupes} already here` : '');
  }
  storageProblem = null;
  pendingImport = null;
  savePlaces(places);
  closeBackupSheet();
  activeArea = 'all'; activeRegion = 'all';
  buildAreaPicker(); render();
  showToast(message, hadBackup ? { label: 'Undo', onAction: undoImport } : null);
}

function undoImport() {
  let restored;
  try { restored = migrate(JSON.parse(storageGet(BACKUP_KEY))).places; }
  catch (e) { showToast('No import to undo'); return; }
  places = restored;
  storageProblem = null;
  if (savePlaces(places)) { try { localStorage.removeItem(BACKUP_KEY); } catch (e) {} }
  closeBackupSheet();
  activeArea = 'all'; activeRegion = 'all';
  buildAreaPicker(); render();
  showToast(`Back to your ${places.length} places`);
}

// ── STORAGE PROBLEM BANNER ────────────────────────────────────────────────────
function renderStorageBanner() {
  const el = document.getElementById('storage-banner');
  el.innerHTML = '';
  if (!storageProblem) return;
  const box = document.createElement('div');
  box.className = 'storage-banner';
  box.setAttribute('role', 'alert');
  const title = document.createElement('strong');
  title.textContent = storageProblem.message;
  const body = document.createElement('div');
  body.textContent = 'Nothing has been deleted, and saving is paused so it can’t be overwritten. ' +
    'Download the unreadable data to keep it, restore a backup, or start a fresh list.';
  const actions = document.createElement('div');
  actions.className = 'banner-actions';
  [['Download unreadable data', exportDamaged],
   ['Restore a backup', openBackupSheet],
   ['Start fresh', startFresh]].forEach(([label, fn]) => {
    const b = document.createElement('button');
    b.textContent = label; b.onclick = fn;
    actions.appendChild(b);
  });
  box.append(title, body, actions);
  el.appendChild(box);
}

function exportDamaged() {
  const raw = storageProblem ? storageProblem.raw : storageGet(DAMAGED_KEY);
  if (raw === null || raw === undefined) return;
  saveFile(raw, `london-list-unreadable-${new Date().toISOString().slice(0, 10)}.txt`, 'text/plain');
}

function startFresh() {
  if (!confirm('Start an empty list? The unreadable data won’t be used.')) return;
  if (!okToLeaveDamagedData()) return;
  storageProblem = null;
  places = [];
  savePlaces(places);
  buildAreaPicker(); render();
}

setupPickers();
buildAreaPicker();
render();
</script>
